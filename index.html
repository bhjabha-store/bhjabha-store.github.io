<style>
:root{
  --wine:#7C2D42; --wine-dark:#5E2233; --wine-soft:#F3E4E7; --gold:#C9A24B; --teal:#3E7C74;
  --ink:#2B2620; --surface:#FBF7EF; --card:#FFFFFF;
  --danger:#B3423F; --danger-soft:#F6E4E2;
  --muted:#8B8378; --border:#E9E1D3; --text:#2B2620;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--surface);color:var(--text);font-family:Tahoma,"Segoe UI","Noto Sans Arabic",Arial,sans-serif;direction:rtl;padding-bottom:90px;}
.topbar{background:linear-gradient(135deg,var(--wine),var(--wine-dark));color:#fff;padding:calc(16px + env(safe-area-inset-top)) 18px 16px;text-align:center;}
.topbar .store-name{font-size:19px;font-weight:800;}
.topbar .store-sub{font-size:12px;opacity:.85;margin-top:2px;}
.container{max-width:640px;margin:0 auto;padding:16px;}
.section{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;}
.section-title{font-size:15px;font-weight:800;margin-bottom:4px;}
.section-hint{font-size:12px;color:var(--muted);margin-bottom:12px;}
.family-section{margin-bottom:14px;}
.family-header{display:flex;justify-content:space-between;align-items:center;background:var(--wine);color:#fff;border-radius:12px;padding:13px 16px;font-size:14.5px;font-weight:800;cursor:pointer;}
.header-right{display:flex;align-items:center;gap:10px;}
.header-right .chip-count{background:rgba(255,255,255,.25);border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700;}
.chevron{font-size:16px;font-weight:800;width:18px;text-align:center;}
.family-body{display:none;padding-top:10px;}
.family-body.open{display:block;}
.sub-section{margin-bottom:12px;}
.sub-header{display:flex;justify-content:space-between;align-items:center;background:var(--wine-soft);color:var(--wine-dark);border-radius:9px;padding:9px 12px;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:8px;}
.sub-header .chip-count{background:rgba(124,45,66,.12);border-radius:10px;padding:2px 8px;font-size:10.5px;font-weight:700;}
.items-grid{display:none;grid-template-columns:1fr 1fr;gap:10px;}
.items-grid.open{display:grid;}
@media (max-width:380px){ .items-grid{grid-template-columns:1fr 1fr;gap:8px;} }
.item-card{border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:0;}
.item-img{width:100%;height:110px;object-fit:cover;border-radius:9px;margin-bottom:8px;background:#f2ede1;}
.item-img-placeholder{width:100%;height:110px;border-radius:9px;margin-bottom:8px;background:#f2ede1;display:flex;align-items:center;justify-content:center;font-size:30px;color:#d8cfbb;}
.item-name{font-size:12.5px;font-weight:700;margin-bottom:4px;line-height:1.35;min-height:2.6em;}
.item-price{font-size:13px;font-weight:800;color:var(--wine);margin-bottom:8px;}
.item-price .cur{font-size:10px;font-weight:400;color:var(--muted);}
.pick-row{display:flex;gap:6px;margin-bottom:8px;}
.color-select{flex:1.4;min-width:0;}
.qty-input{flex:1;min-width:0;}
.color-select, .qty-input{padding:8px 6px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:12px;background:#FCFAF6;}
.out-of-stock{color:var(--danger);font-size:11px;font-weight:700;padding:8px;text-align:center;}
.last-piece-badge{background:var(--danger-soft);color:var(--danger);font-size:10.5px;font-weight:700;padding:5px 8px;border-radius:6px;margin-bottom:8px;text-align:center;}
.btn{padding:10px 16px;border:none;border-radius:9px;font-weight:700;cursor:pointer;font-size:13.5px;}
.btn-add{background:var(--teal);color:#fff;width:100%;}
.btn-add:disabled{background:#ccc;cursor:not-allowed;}
.cart-bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;box-shadow:0 -4px 16px rgba(0,0,0,.08);z-index:500;}
.cart-bar .count{font-size:13px;color:var(--muted);}
.cart-bar .total{font-size:16px;font-weight:800;color:var(--wine);}
.cart-bar button{background:var(--wine);color:#fff;padding:11px 26px;}
html, body{height:100%;}
.page-view{display:none;min-height:100vh;background:var(--surface);}
.page-view.open{display:block;}
.page-view-topbar{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,var(--wine),var(--wine-dark));color:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;display:flex;align-items:center;gap:14px;}
.back-btn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);padding:8px 16px;border-radius:20px;font-size:13px;cursor:pointer;flex-shrink:0;}
.page-view-title{font-weight:800;font-size:15px;}
.cart-line{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.cart-line button{background:none;border:none;color:var(--danger);font-size:16px;cursor:pointer;}
.field{margin-bottom:10px;}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px;}
.field input, .field textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:14px;background:#FCFAF6;}
.confirm-box{text-align:center;padding:30px 16px;}
.confirm-box .icon{font-size:48px;margin-bottom:10px;}
.tag{display:inline-block;background:var(--danger-soft);color:var(--danger);border-radius:6px;padding:2px 8px;font-size:11px;}
.loading{text-align:center;padding:40px;color:var(--muted);}
</style>
</head>
<body>
<div class="topbar">
  <div class="store-name">🧕 متجر بحجابها</div>
  <div class="store-sub">تصفّح واطلب مباشرة</div>
  <button onclick="openTrackModal()" style="margin-top:10px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);padding:7px 16px;border-radius:20px;font-size:12px;cursor:pointer;">📦 تتبع طلبي</button>
</div>
<div class="container" id="mainContainer">
  <div class="loading">جاري تحميل المنتجات...</div>
</div>

<div class="cart-bar" id="cartBar" style="display:none;">
  <div><div class="count" id="cartCount">0 قطعة</div><div class="total" id="cartTotal">0</div></div>
  <button onclick="openCartModal()">🛒 عرض السلة والطلب</button>
</div>

<div class="page-view" id="cartModal">
  <div class="page-view-topbar">
    <button class="back-btn" onclick="closeCartModal()">→ رجوع للمتجر</button>
    <span class="page-view-title">🛒 سلة الطلب</span>
  </div>
  <div class="container" id="cartModalBox"></div>
</div>

<div class="page-view" id="trackModal">
  <div class="page-view-topbar">
    <button class="back-btn" onclick="closeTrackModal()">→ رجوع للمتجر</button>
    <span class="page-view-title">📦 تتبع طلبي</span>
  </div>
  <div class="container" id="trackModalBox"></div>
</div>

<script>
// ============ SUPABASE CONFIGURATION ============
const SUPABASE_URL = "https://wgodzednsugquxfnhqiw.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Ae_4_ZfZDnwtgGWuJ17B3g_a_CP34UZ";
async function sendAdminTelegramNotification(message){
  try{
    const functionUrl = SUPABASE_URL.replace(/\/$/, "") + "/functions/v1/telegram-notify";
    await fetch(functionUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": "Bearer " + SUPABASE_ANON_KEY, "apikey": SUPABASE_ANON_KEY },
      body: JSON.stringify({ message })
    });
  }catch(e){
    console.error("Telegram notification failed", e);
  }
}

let supabaseClient = null;
let catalog = [];
let cart = []; // {catId, catName, family, sub, color, price, qty, maxQty}
let ckPhone1 = "", ckPhone2 = "", ckCityGroup = "tripoli", ckOtherCity = "", ckZone = "", ckCity = "", ckNotes = "";

const COLOR_ORDER = ["أسود", "أبيض ثلجي", "أبيض", "اوف وايت", "سكري", "سكري داكن", "أزرق كحلي داكن", "أزرق كحلي 1", "أزرق كحلي 2", "ازرق حبري", "أزرق سحابي داكن", "أزرق سحابي", "أزرق ملكي", "أزرق نيلي", "سماوي", "سماوي هافت", "أخضر بترولي", "أخضر بترولي ناصع", "زيتوني داكن", "زيتوني جيشي", "زيتي", "تركوازي داكن", "تركوازي", "تيفاني", "فستقي", "فسفوري", "زرعي", "أحمر دم غزال داكن", "أحمر دم غزال", "عنابي داكن", "عنابي", "حني داكن", "وقيدي", "وردي داكن", "وردي درجة متوسطة", "وردي هافت", "وردي هافت1", "موف داكن", "موف", "موف حلو", "موف هادي", "موف غريب", "بنفسجي", "قهوي داكن  كحلي", "قهوي داكن 1", "قهوي داكن 2", "قهوي", "قهوي حلو1", "قهوي حلو2", "كاكاوي", "كابتشينو", "قرفي", "قرفي هافت", "بيج داكن بزاري", "بيج غامق", "بيج هافت", "بيج رملي", "بيج رملي1", "رصاصي داكن  كحلي", "رصاصي داكن", "رصاصي داكن غونتشي", "رصاصي درجة متوسط1", "رصاصي درجة متوسط2", "رصاصي درجة متوسط3", "رصاصي درجة متوسط4", "رصاصي هافت", "درجات محيرة", "أزرق كحلي", "وردي هافت2", "أزرق حبري", "أزرق سحابي2", "أخضر زيتوني داكن", "أخضر زيتوني", "موف داكن جدا", "رصاصي داكن كحلي"];
function sortColorsCanonical(names){
  return names.slice().sort((a,b)=>{
    let ia = COLOR_ORDER.indexOf(a); if(ia<0) ia = 999;
    let ib = COLOR_ORDER.indexOf(b); if(ib<0) ib = 999;
    if(ia!==ib) return ia-ib;
    return a.localeCompare(b);
  });
}
function esc(s){ return (s||"").toString().replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmt(n){ return Number(n||0).toLocaleString("en-US",{maximumFractionDigits:2}); }

function showModal(id){
  document.getElementById("mainContainer").style.display = "none";
  document.getElementById("cartBar").style.display = "none";
  document.getElementById(id).classList.add("open");
  window.scrollTo(0,0);
}
function hideModal(id){
  document.getElementById(id).classList.remove("open");
  document.getElementById("mainContainer").style.display = "";
  updateCartBar();
  window.scrollTo(0,0);
}

async function init(){
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY){
    document.getElementById("mainContainer").innerHTML = `<div class="section"><div class="section-title">⚠ لم يتم إعداد المتجر بعد</div><div class="section-hint">صاحب المتجر يحتاج لصق رابط ومفتاح قاعدة البيانات في أعلى هذا الملف.</div></div>`;
    return;
  }
  try{
    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const { data, error } = await supabaseClient.from("public_catalog").select("data").eq("id","main").maybeSingle();
    if(error) throw error;
    catalog = (data && data.data) ? data.data : [];
    renderCatalog();
  }catch(e){
    document.getElementById("mainContainer").innerHTML = `<div class="section"><div class="section-title">⚠ تعذّر تحميل المنتجات</div><div class="section-hint">${esc(e && e.message ? e.message : String(e))}</div></div>`;
  }
}

let openFamilies = {};
let openSubs = {};
function toggleFamily(f){ openFamilies[f] = (openFamilies[f]===false) ? true : false; renderCatalog(); }
function toggleSub(key){ openSubs[key] = (openSubs[key]===false) ? true : false; renderCatalog(); }
function renderCatalog(){
  const el = document.getElementById("mainContainer");
  if(!catalog.length){
    el.innerHTML = `<div class="section"><div class="section-title">لا توجد منتجات معروضة حالياً</div><div class="section-hint">تفقّد المتجر لاحقاً</div></div>`;
    return;
  }
  const families = [...new Set(catalog.map(i=>i.family))];

  let html = "";
  families.forEach(fam=>{
    const famItems = catalog.filter(i=>i.family===fam);
    const famOpen = openFamilies[fam] !== false; // default open
    const subs = [...new Set(famItems.map(i=>i.sub))];
    html += `
      <div class="family-section">
        <div class="family-header" onclick="toggleFamily('${esc(fam).replace(/'/g,"\\'")}')">
          <span>${esc(fam)}</span>
          <span class="header-right"><span class="chip-count">${famItems.length}</span><span class="chevron">${famOpen?'−':'+'}</span></span>
        </div>
        <div class="family-body ${famOpen?'open':''}">
          ${subs.map(sub=>{
            const subKey = fam+'__'+sub;
            const subItems = famItems.filter(i=>i.sub===sub);
            const subOpen = openSubs[subKey] !== false; // default open
            return `
            <div class="sub-section">
              <div class="sub-header" onclick="toggleSub('${esc(subKey).replace(/'/g,"\\'")}')">
                <span>${esc(sub)}</span>
                <span class="header-right"><span class="chip-count">${subItems.length}</span><span class="chevron">${subOpen?'−':'+'}</span></span>
              </div>
              <div class="items-grid ${subOpen?'open':''}">
                ${subItems.map(item=>renderItemCard(item)).join("")}
              </div>
            </div>`;
          }).join("")}
        </div>
      </div>`;
  });
  el.innerHTML = html;
}

function renderItemCard(item){
  const hasColors = item.colors && Object.keys(item.colors).length;
  const outOfStock = hasColors ? Object.keys(item.colors).length===0 : (item.stock<=0);
  let body = "";
  if(outOfStock){
    body = `<div class="out-of-stock">نفدت الكمية حالياً</div>`;
  } else if(hasColors){
    const colorOpts = sortColorsCanonical(Object.keys(item.colors)).map(c=>{
      const q = item.colors[c];
      const lastPieceTag = q===1 ? " — آخر قطعة!" : "";
      return `<option value="${esc(c)}">${esc(c)}${lastPieceTag}</option>`;
    }).join("");
    body = `
      <div class="pick-row">
        <select class="color-select" id="color_${item.id}" onchange="onColorPicked('${item.id}', this.value)">
          <option value="" disabled selected>اضغط لاختيار اللون</option>
          ${colorOpts}
        </select>
        <input type="number" class="qty-input" id="qty_${item.id}" value="1" min="1" placeholder="الكمية">
      </div>
      <div class="last-piece-badge" id="lastpiece_${item.id}" style="display:none;">⚠ آخر قطعة متوفرة بهذا اللون!</div>
      <button class="btn btn-add" onclick="addToCart('${item.id}')">➕ أضف للسلة</button>`;
  } else {
    body = `
      <div class="pick-row">
        <input type="number" class="qty-input" id="qty_${item.id}" value="1" min="1" placeholder="الكمية">
      </div>
      <button class="btn btn-add" onclick="addToCart('${item.id}')">➕ أضف للسلة</button>`;
  }
  const initialImg = item.image || "";
  const imgHtml = `
    <img id="img_${item.id}" src="${esc(initialImg)}" alt="${esc(item.name)}" class="item-img" style="${initialImg?'':'display:none;'}" onerror="this.style.display='none'; var ph=document.getElementById('imgph_${item.id}'); if(ph) ph.style.display='flex';">
    <div id="imgph_${item.id}" class="item-img-placeholder" style="${initialImg?'display:none;':''}">🧕</div>`;
  return `
    <div class="item-card">
      ${imgHtml}
      <div class="item-name">${esc(item.name)}</div>
      <div class="item-price">${fmt(item.price)} <span class="cur">د.ل</span></div>
      ${body}
    </div>`;
}

function onColorPicked(itemId, color){
  const item = catalog.find(i=>i.id===itemId);
  if(!item) return;
  const url = (item.colorImages && item.colorImages[color]) || item.image || "";
  const imgEl = document.getElementById("img_"+itemId);
  const phEl = document.getElementById("imgph_"+itemId);
  if(url){
    if(imgEl){ imgEl.src = url; imgEl.style.display = "block"; }
    if(phEl) phEl.style.display = "none";
  } else {
    if(imgEl) imgEl.style.display = "none";
    if(phEl) phEl.style.display = "flex";
  }
  const badgeEl = document.getElementById("lastpiece_"+itemId);
  if(badgeEl){
    const qty = item.colors ? item.colors[color] : null;
    badgeEl.style.display = (qty===1) ? "block" : "none";
  }
}
function addToCart(catId){
  const item = catalog.find(i=>i.id===catId);
  if(!item) return;
  const hasColors = item.colors && Object.keys(item.colors).length;
  let color = "", maxQty = item.stock||0;
  if(hasColors){
    const colorSel = document.getElementById("color_"+catId);
    color = colorSel.value;
    if(!color){ alert("اضغط لاختيار اللون أولاً"); return; }
    maxQty = item.colors[color]||0;
  }
  const qtyEl = document.getElementById("qty_"+catId);
  let qty = parseInt(qtyEl.value)||0;
  if(qty<1){ alert("أدخل كمية صحيحة"); return; }
  if(qty>maxQty){ alert("الكمية المطلوبة غير متوفرة"); return; }

  const existing = cart.find(c=>c.catId===catId && c.color===color);
  if(existing){
    if(existing.qty+qty>maxQty){ alert("الكمية المطلوبة غير متوفرة"); return; }
    existing.qty += qty;
  } else {
    cart.push({catId, catName:item.name, color, price:item.price, qty, maxQty});
  }
  if(typeof fbq !== "undefined"){
    fbq('track', 'AddToCart', {
      content_ids: [catId], content_name: item.name, content_type: 'product',
      value: item.price*qty, currency: 'LYD'
    });
  }
  updateCartBar();
  qtyEl.value = 1;
  const bar = document.getElementById("cartBar");
  bar.style.background = "#eef7f0";
  setTimeout(()=>{ bar.style.background = ""; }, 300);
}

function updateCartBar(){
  const totalQty = cart.reduce((s,c)=>s+c.qty,0);
  const totalPrice = cart.reduce((s,c)=>s+c.qty*c.price,0);
  const bar = document.getElementById("cartBar");
  if(totalQty>0){
    bar.style.display = "flex";
    document.getElementById("cartCount").textContent = totalQty + " قطعة";
    document.getElementById("cartTotal").textContent = fmt(totalPrice) + " د.ل";
  } else {
    bar.style.display = "none";
  }
}

function openCartModal(){
  const box = document.getElementById("cartModalBox");
  const totalPrice = cart.reduce((s,c)=>s+c.qty*c.price,0);
  if(typeof fbq !== "undefined" && cart.length){
    fbq('track', 'InitiateCheckout', {
      content_ids: cart.map(c=>c.catId), content_type: 'product',
      num_items: cart.reduce((s,c)=>s+c.qty,0), value: totalPrice, currency: 'LYD'
    });
  }
  const linesHtml = cart.map((c,i)=>`
    <div class="cart-line">
      <span>${esc(c.catName)}${c.color?" — "+esc(c.color):""}: ${c.qty} × ${fmt(c.price)}</span>
      <span>${fmt(c.qty*c.price)} <button onclick="removeCartLine(${i})">✖</button></span>
    </div>`).join("") || `<div class="section-hint">السلة فارغة</div>`;

  box.innerHTML = `
    <div class="section-title">🛒 سلة الطلب</div>
    <div style="margin:10px 0;">${linesHtml}</div>
    <div style="font-weight:800;font-size:15px;margin:12px 0;text-align:left;">الإجمالي: ${fmt(totalPrice)} د.ل</div>
    <div class="field"><label>رقم الهاتف 1</label><input type="text" id="ck_phone1" value="${esc(ckPhone1)}" onchange="ckPhone1=this.value" placeholder="رقم للتواصل"></div>
    <div class="field"><label>رقم الهاتف 2 (اختياري)</label><input type="text" id="ck_phone2" value="${esc(ckPhone2)}" onchange="ckPhone2=this.value"></div>
    <div class="field"><label>التصنيف</label>
      <select id="ck_cityGroup" onchange="onCkCityGroupChange(this.value)">
        <option value="tripoli" ${ckCityGroup==='tripoli'?'selected':''}>طرابلس</option>
        <option value="other" ${ckCityGroup==='other'?'selected':''}>مدن أخرى</option>
      </select>
    </div>
    ${ckCityGroup==="tripoli"
      ? `<div class="field"><label>المدينة</label><input type="text" value="طرابلس" disabled style="background:#F0EBDD;color:var(--muted);"></div>`
      : `<div class="field"><label>المدينة</label><input type="text" id="ck_otherCity" value="${esc(ckOtherCity)}" onchange="ckOtherCity=this.value" placeholder="اسم المدينة"></div>`}
    <div class="field"><label>المنطقة</label><input type="text" id="ck_zone" value="${esc(ckZone)}" onchange="ckZone=this.value" placeholder="اسم المنطقة/الحي"></div>
    <div class="field"><label>العنوان</label><input type="text" id="ck_city" value="${esc(ckCity)}" onchange="ckCity=this.value" placeholder="عنوانك بالتفصيل"></div>
    <div class="field"><label>ملاحظات (اختياري)</label><textarea id="ck_notes" rows="2" onchange="ckNotes=this.value">${esc(ckNotes)}</textarea></div>
    <button class="btn" style="background:var(--wine);color:#fff;width:100%;font-size:14px;padding:12px;" onclick="submitOrder()">✅ تأكيد الطلب</button>
    <button class="btn" style="background:transparent;color:var(--muted);width:100%;margin-top:6px;" onclick="closeCartModal()">إغلاق</button>
  `;
  showModal("cartModal");
}
function onCkCityGroupChange(val){
  ckCityGroup = val;
  if(val!=="other") ckOtherCity = "";
  openCartModal();
}
function closeCartModal(){
  hideModal("cartModal");
}
function removeCartLine(idx){
  cart.splice(idx,1);
  updateCartBar();
  openCartModal();
}
async function submitOrder(){
  if(!cart.length){ alert("السلة فارغة"); return; }
  const phone1 = document.getElementById("ck_phone1").value.trim();
  const cityGroup = document.getElementById("ck_cityGroup").value;
  const otherCityEl = document.getElementById("ck_otherCity");
  const otherCityName = cityGroup==="other" && otherCityEl ? otherCityEl.value.trim() : "";
  const zone = document.getElementById("ck_zone").value.trim();
  const city = document.getElementById("ck_city").value.trim();
  const phone2 = document.getElementById("ck_phone2").value.trim();
  const notes = document.getElementById("ck_notes").value.trim();
  if(!phone1 || !city){ alert("يرجى تعبئة رقم الهاتف والعنوان على الأقل"); return; }

  const orderData = {
    phone1, phone2, cityGroup, otherCityName,
    zone: cityGroup==="tripoli" ? zone : "",
    otherZone: cityGroup==="other" ? zone : "",
    city, notes,
    items: cart.map(c=>({catId:c.catId, color:c.color, price:c.price, qty:c.qty}))
  };
  try{
    const id = "ord_" + Date.now() + Math.random().toString(36).slice(2,8);
    const { error } = await supabaseClient.from("customer_orders").insert({ id, order_data: orderData, status: "new" });
    if(error) throw error;
    const totalValue = cart.reduce((s,c)=>s+c.qty*c.price,0);
    sendAdminTelegramNotification(
      `🛍 <b>طلب جديد من المتجر الإلكتروني</b>\n` +
      `📞 ${phone1}\n` +
      `💰 الإجمالي: ${fmt(totalValue)} د.ل\n` +
      `📦 عدد القطع: ${cart.reduce((s,c)=>s+c.qty,0)}`
    );
    if(typeof fbq !== "undefined"){
      fbq('track', 'Purchase', {
        content_ids: cart.map(c=>c.catId), content_type: 'product',
        num_items: cart.reduce((s,c)=>s+c.qty,0), value: totalValue, currency: 'LYD'
      });
    }
    cart = [];
    ckPhone1 = ""; ckPhone2 = ""; ckCityGroup = "tripoli"; ckOtherCity = ""; ckZone = ""; ckCity = ""; ckNotes = "";
    updateCartBar();
    closeCartModal();
    try{ localStorage.setItem("bh_last_order_phone", phone1); }catch(e){}
    document.getElementById("mainContainer").innerHTML = `
      <div class="section confirm-box">
        <div class="icon">✅</div>
        <div class="section-title">تم إرسال طلبك بنجاح</div>
        <div class="section-hint">سيتواصل معك المتجر قريباً لتأكيد الطلب والتوصيل</div>
        <div style="margin-top:14px;font-size:12px;color:var(--muted);">رقم تتبع الطلب</div>
        <div style="font-family:monospace;font-size:13px;background:#F3EEE3;border-radius:8px;padding:8px;margin-top:4px;word-break:break-all;">${esc(id)}</div>
        <button class="btn" style="background:var(--teal);color:#fff;margin-top:16px;" onclick="openTrackModal()">📦 تتبع حالة طلبي</button>
      </div>`;
  }catch(e){
    alert("تعذّر إرسال الطلب: " + (e && e.message ? e.message : e));
  }
}

function openTrackModal(){
  const box = document.getElementById("trackModalBox");
  let savedPhone = "";
  try{ savedPhone = localStorage.getItem("bh_last_order_phone") || ""; }catch(e){}
  box.innerHTML = `
    <div class="section-title">📦 تتبع طلبي</div>
    <div class="section-hint">أدخل رقم الهاتف الذي استخدمته عند الطلب</div>
    <div class="field"><input type="text" id="track_phone" value="${esc(savedPhone)}" placeholder="رقم الهاتف"></div>
    <button class="btn" style="background:var(--wine);color:#fff;width:100%;padding:12px;" onclick="lookupOrders()">🔎 بحث</button>
    <div id="trackResults" style="margin-top:14px;"></div>
    <button class="btn" style="background:transparent;color:var(--muted);width:100%;margin-top:10px;" onclick="closeTrackModal()">إغلاق</button>
  `;
  showModal("trackModal");
}
function closeTrackModal(){
  hideModal("trackModal");
}
async function lookupOrders(){
  const phone = document.getElementById("track_phone").value.trim();
  const resultsEl = document.getElementById("trackResults");
  if(!phone){ resultsEl.innerHTML = `<div class="section-hint">أدخل رقم الهاتف</div>`; return; }
  resultsEl.innerHTML = `<div class="loading" style="padding:16px;">جاري البحث...</div>`;
  try{
    const { data, error } = await supabaseClient.from("customer_orders").select("*").eq("order_data->>phone1", phone).order("created_at",{ascending:false});
    if(error) throw error;
    if(!data || !data.length){ resultsEl.innerHTML = `<div class="section-hint">لا توجد طلبات بهذا الرقم</div>`; return; }
    const statusLabel = (s)=> s==="new" ? "⏳ قيد المراجعة" : (s==="imported" ? "✅ تم التأكيد" : "❌ تم الإلغاء");
    resultsEl.innerHTML = data.map(o=>{
      const od = o.order_data || {};
      const itemsTxt = (od.items||[]).map(it=>`${it.qty} × ${fmt(it.price)}`).join("، ");
      return `<div class="cart-line" style="flex-direction:column;align-items:flex-start;gap:4px;">
        <div style="display:flex;justify-content:space-between;width:100%;"><b>${new Date(o.created_at).toLocaleDateString("ar-LY")}</b><span>${statusLabel(o.status)}</span></div>
        <div style="font-size:12px;color:var(--muted);">${esc(itemsTxt)}</div>
      </div>`;
    }).join("");
  }catch(e){
    resultsEl.innerHTML = `<div class="section-hint">تعذّر البحث: ${esc(e && e.message ? e.message : String(e))}</div>`;
  }
}

init();
</script>
</body>
</html>
