<title>منظومة بحجابها</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/JsBarcode/3.11.5/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#221F26; --ink-2:#2E2A33; --surface:#FAF6EF; --card:#FFFFFF;
  --wine:#7C2D42; --wine-dark:#5C1F30; --wine-soft:#F3E4E7;
  --gold:#A9793B; --gold-soft:#F4EADA;
  --teal:#2F5D57; --teal-soft:#E4EEEB;
  --danger:#B3423F; --danger-soft:#F6E4E2;
  --muted:#75695A; --border:#E9E1D3; --text:#2B2620;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--surface);color:var(--text);font-family:Tahoma,"Segoe UI","Noto Sans Arabic",Arial,sans-serif;min-height:100vh;display:flex;direction:rtl;line-height:1.5;}
button, input, select, .nav-item, .cat-item, .tab{transition:background .15s ease, border-color .15s ease, box-shadow .15s ease, opacity .15s ease;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#D8CCB8;border-radius:8px;}
#sidebar{width:250px;min-width:250px;background:linear-gradient(180deg,var(--ink) 0%, var(--ink-2) 100%);color:#EFE9DF;padding:22px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:calc(22px + env(safe-area-inset-top));}
.mobile-topbar{display:none;}
#sidebarOverlay{display:none;}
.brand{display:flex;align-items:center;gap:10px;padding-bottom:18px;margin-bottom:14px;border-bottom:1px solid rgba(255,255,255,.12);}
.brand-mark{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,var(--wine),var(--gold));display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.brand-title{font-size:15px;font-weight:700;line-height:1.3;}
.brand-sub{font-size:11px;color:#B8AF9E;}
.nav-section{margin-top:14px;}
.nav-label{font-size:11px;color:#9C9282;padding:4px 10px;letter-spacing:.5px;}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13.5px;color:#E7E1D5;margin:2px 0;transition:background .15s;}
.nav-item:hover{background:rgba(255,255,255,.07);}
.nav-item.active{background:var(--wine);color:#fff;font-weight:600;}
.nav-icon{width:18px;text-align:center;font-size:14px;}
.nav-group{margin-top:2px;}
.nav-group-head{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;font-size:12.5px;color:#CFC6B6;cursor:pointer;border-radius:8px;}
.nav-group-head:hover{background:rgba(255,255,255,.06);}
.nav-sub{padding-right:14px;display:none;}
.nav-sub.open{display:block;}
.nav-subitem{padding:6px 10px;font-size:12.5px;color:#C9C0B0;border-radius:6px;cursor:pointer;}
.nav-subitem:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-subitem.active{background:var(--wine-dark);color:#fff;}
#main{flex:1;min-width:0;padding:26px 30px 60px;}
#main > *{max-width:1320px;margin-left:auto;margin-right:auto;}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
.page-title{font-size:21px;font-weight:800;color:var(--ink);}
.page-sub{font-size:12.5px;color:var(--muted);margin-top:3px;}
.currency-box{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:7px 10px;font-size:12px;color:var(--muted);}
.currency-box input{border:none;background:transparent;width:46px;font-size:12.5px;color:var(--text);font-family:inherit;text-align:center;}
.currency-box input:focus{outline:none;}
.scallop{height:14px;width:100%;margin-bottom:20px;background-image:radial-gradient(circle at 10px 0, transparent 9px, var(--border) 9.5px, transparent 10px);background-size:20px 14px;background-repeat:repeat-x;background-position:top;opacity:.6;}

function getSupabaseConfig(){

  catch(e){ return {url:"", key:""}; }

function clearSupabaseConfig(){
  try{ localStorage.removeItem("bh_supabase_url"); localStorage.removeItem("bh_supabase_key"); }catch(e){}
  if(realtimeChannel && supabaseClient){ try{ supabaseClient.removeChannel(realtimeChannel); }catch(e){} }
  if(onlineStoreChannel && supabaseClient){ try{ supabaseClient.removeChannel(onlineStoreChannel); }catch(e){} }
  supabaseClient = null; realtimeChannel = null; lastKnownUpdatedAt = null; onlineStoreChannel = null;
}
function initSupabase(){
  const cfg = getSupabaseConfig();
  if(!cfg.url || !cfg.key) return false;
  if(typeof supabase === "undefined") return false;
  try{ supabaseClient = supabase.createClient(cfg.url, cfg.key); return true; }
  catch(e){ console.error("Supabase init failed", e); return false; }
}
function setupRealtimeSync(){
  if(!supabaseClient) return;
  try{
    realtimeChannel = supabaseClient.channel("app_state_sync")
      .on("postgres_changes", { event:"*", schema:"public", table:"app_state", filter:`id=eq.${STATE_ROW_ID}` }, (payload)=>{
        if(!payload.new || !payload.new.updated_at) return;
        if(payload.new.updated_at === lastKnownUpdatedAt) return;
        applyingRemoteUpdate = true;
        state = payload.new.data;
        lastKnownUpdatedAt = payload.new.updated_at;
        render();
        applyingRemoteUpdate = false;
      })
      .subscribe();
  }catch(e){ console.error("Realtime subscribe failed", e); }
}

async function storageGet(key){
  if(supabaseClient){
    try{
      const { data, error } = await supabaseClient.from("app_state").select("data, updated_at").eq("id", STATE_ROW_ID).maybeSingle();
      if(error) throw error;
      storageMode = "cloud";
      if(data){ lastKnownUpdatedAt = data.updated_at; return { value: JSON.stringify(data.data) }; }
      return null;
    }catch(e){ console.error("Supabase load failed, falling back", e); storageMode = "cloud-error"; }
  }
  if(typeof window.storage !== "undefined" && window.storage){
    try{ const r = await window.storage.get(key); if(storageMode!=="cloud-error") storageMode="claude"; return r; }catch(e){}
  }
  try{ const v = localStorage.getItem(key); if(storageMode!=="cloud-error") storageMode="local"; return v ? {value:v} : null; }catch(e){}
  if(storageMode!=="cloud-error") storageMode="memory";
  return memoryFallbackValue ? {value:memoryFallbackValue} : null;
}
async function storageSet(key, val){
  if(supabaseClient){
    try{
      const nowIso = new Date().toISOString();
      const { error } = await supabaseClient.from("app_state").upsert({ id: STATE_ROW_ID, data: JSON.parse(val), updated_at: nowIso });
      if(error) throw error;
      lastKnownUpdatedAt = nowIso;
      storageMode = "cloud";
      try{ localStorage.setItem(key, val); }catch(e){}
      return true;
    }catch(e){ console.error("Supabase save failed, falling back", e); storageMode = "cloud-error"; }
  }
  if(typeof window.storage !== "undefined" && window.storage){
    try{ await window.storage.set(key, val); if(storageMode!=="cloud-error") storageMode="claude"; return true; }catch(e){}
  }
  try{ localStorage.setItem(key, val); if(storageMode!=="cloud-error") storageMode="local"; return true; }catch(e){}
  memoryFallbackValue = val; if(storageMode!=="cloud-error") storageMode="memory";
  return false;
}

function attemptLogin(role){
  const pw = document.getElementById("loginPassword").value;
  const expected = role==="admin" ? state.settings.adminPassword : state.settings.viewerPassword;
  if(role==="viewer" && !expected){
    // viewer password not configured — allow blank-password viewer access
  } else if(pw !== expected){
    document.getElementById("loginError").textContent = "كلمة المرور غير صحيحة";
    return;
  }
  authenticated = true;
  currentRole = role;
  try{ sessionStorage.setItem("bh_role", role); }catch(e){}
  const gate = document.getElementById("loginGate");
  if(gate) gate.remove();
  render();
}

let cameraScanContext = null;
let cameraScanStream = null;
let cameraScanActive = false;
async function startCameraScan(context){
  if(typeof window.BarcodeDetector === "undefined"){
    alert("متصفحك لا يدعم قراءة الباركود بالكاميرا مباشرة. الرجاء استخدام قارئ باركود خارجي (USB/Bluetooth) أو كتابة الباركود يدوياً في خانة المسح.");
    return;
  }
  cameraScanContext = context;
  try{
    cameraScanStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    const video = document.getElementById("cameraScanVideo");
    const modal = document.getElementById("cameraScanModal");
    video.srcObject = cameraScanStream;
    modal.style.display = "flex";
    await video.play();
    cameraScanActive = true;
    const detector = new window.BarcodeDetector();
    const scanLoop = async ()=>{
      if(!cameraScanActive) return;
      try{
        const barcodes = await detector.detect(video);
        if(barcodes && barcodes.length){
          const code = barcodes[0].rawValue;
          stopCameraScan();
          handleBarcodeScan(cameraScanContext, code);
          return;
        }
      }catch(e){ /* keep scanning */ }
      if(cameraScanActive) requestAnimationFrame(scanLoop);
    };
    scanLoop();
  }catch(e){
    alert("تعذّر الوصول إلى الكاميرا: " + (e && e.message ? e.message : e));
  }
}
function stopCameraScan(){
  cameraScanActive = false;
  if(cameraScanStream){ cameraScanStream.getTracks().forEach(t=>t.stop()); cameraScanStream = null; }
  const modal = document.getElementById("cameraScanModal");
  if(modal) modal.style.display = "none";
}
function handleBarcodeScan(context, code){
  code = (code||"").trim();
  if(!code) return;
  const found = lookupBarcode(code);
  if(!found){ alert("باركود غير معروف: " + code); return; }
  const cat = state.categories.find(c=>c.id===found.catId);
  if(!cat) return;
  const color = found.color || "";

  if(context==="pu" || context==="pd"){
    const sub = state.subs.find(s=>s.id===cat.subId);
    const familyId = sub ? sub.familyId : null;

    const familySel = document.getElementById(context+"_item_family");
    if(familySel) familySel.value = familyId;
    if(context==="pu") onPuFamilyChange(familyId); else onPdFamilyChange(familyId);

    const subSel = document.getElementById(context+"_item_sub");
    if(subSel) subSel.value = cat.subId;
    if(context==="pu") onPuSubChange(cat.subId); else onPdSubChange(cat.subId);

    const itemSel = document.getElementById(context+"_item_cat");
    if(itemSel) itemSel.value = found.catId;
    if(context==="pd") onPdItemChange(found.catId);

    const colorEl = document.getElementById(context+"_item_color");
    if(colorEl) colorEl.value = color;

    const priceEl = document.getElementById(context+"_item_price");
    const qtyEl = document.getElementById(context+"_item_qty");
    if(priceEl) priceEl.value = "";
    if(qtyEl){ qtyEl.value = ""; qtyEl.focus(); }
  } else if(context==="resolve"){
    const idx = resolveDraftItems.findIndex(it=>it.catId===found.catId && (it.color||"")===color);
    if(idx<0){ alert("هذا الصنف غير موجود ضمن بنود هذه الفاتورة"); return; }
    const it = resolveDraftItems[idx];
    it.soldQty = Math.min(it.qty, (it.soldQty||0)+1);
    render();
  }
}

/* ==================== INVOICE-DERIVED CATEGORY ITEMS ==================== */
function catPurchaseItems(catId){
  const items = [];
  state.purchaseInvoices.forEach(inv=> inv.items.forEach(it=>{
    if(it.catId===catId) items.push(Object.assign({date:inv.date, seller:inv.seller, invoiceNo:inv.number, invoiceId:inv.id}, it));
  }));
  return items;
}
function catSaleItems(catId){
  const items = [];
  state.salesInvoices.forEach(inv=> inv.items.forEach(it=>{
    if(it.catId===catId) items.push(Object.assign({date:inv.date, phone1:inv.phone1, phone2:inv.phone2, city:inv.city, invoiceNo:inv.number, invoiceId:inv.id, cityGroup:inv.cityGroup}, it));
  }));
  state.pendingInvoices.forEach(inv=>{
    if(inv.status==="pending") return;
    inv.items.forEach(it=>{
      const soldQty = it.soldQty||0;
      if(it.catId===catId && soldQty>0){
        items.push({date:inv.resolvedDate||inv.date, phone1:inv.phone1, phone2:inv.phone2, city:inv.city, invoiceNo:inv.number, invoiceId:inv.id, cityGroup:inv.cityGroup,
          catId:it.catId, catName:it.catName, color:it.color, price:it.price, qty:soldQty, total: Math.round(it.price*soldQty*100)/100});
      }
    });
  });
  return items;
}
function pendingQtyForCat(catId){
  let sum = 0;
  state.pendingInvoices.forEach(inv=>{
    if(inv.status==="pending") inv.items.forEach(it=>{ if(it.catId===catId) sum += Number(it.qty)||0; });
  });
  return sum;
}
function pendingQtyForCatColor(catId, color){
  let sum = 0;
  state.pendingInvoices.forEach(inv=>{
    if(inv.status==="pending") inv.items.forEach(it=>{ if(it.catId===catId && it.color===color) sum += Number(it.qty)||0; });
  });
  return sum;
}
function effectiveColorQty(cat, color){
  const base = (cat.colors && cat.colors[color]!==undefined) ? cat.colors[color] : 0;
  return base - pendingQtyForCatColor(cat.id, color);
}
function availableColorsList(cat){
  if(!cat.colors) return [];
  return sortColorsCanonical(Object.keys(cat.colors)).filter(c=>effectiveColorQty(cat,c)>0);
}
function sharedAvailableColors(catA, catB){
  const a = new Set(availableColorsList(catA));
  const listB = availableColorsList(catB);
  const shared = listB.filter(c=>a.has(c));
  return sortColorsCanonical(shared);
}
function copyToClipboard(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{
      alert("تم نسخ الألوان ✅");
    }).catch(()=>{ fallbackCopy(text); });
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text){
  try{
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    alert("تم نسخ الألوان ✅");
  }catch(e){
    showCustomPrompt("تعذّر النسخ التلقائي، انسخ النص يدوياً (يمكنك تحديده ونسخه يدوياً):", text);
  }
}

function itemAvailableQty(catId, color){
  const cat = state.categories.find(c=>c.id===catId);
  if(!cat) return 0;
  if(color && cat.colors) return effectiveColorQty(cat, color);
  return catTotals(cat).stock;
}
function checkPendingStockAvailability(items){
  _catTotalsCache = {}; // always use fresh totals for availability checks, even mid-mutation
  const details = items.map(it=>{
    const available = itemAvailableQty(it.catId, it.color);
    return Object.assign({}, it, {available, ok: (Number(it.qty)||0) <= available});
  });
  return { ok: details.every(d=>d.ok), details };
}
let _catTotalsCache = {};
function catTotals(cat){
  if(_catTotalsCache[cat.id]) return _catTotalsCache[cat.id];
  const b = cat.base;
  const purchaseItems = catPurchaseItems(cat.id);
  const saleItems = catSaleItems(cat.id);
  const pQty = b.purchaseQty + sumBy(purchaseItems,"qty");
  const pAmt = b.purchaseAmount + sumBy(purchaseItems,"total");
  const avgP = pQty ? pAmt/pQty : 0;
  const baseSaleAmt = b.avgSalePrice * b.saleQty;
  const sQty = b.saleQty + sumBy(saleItems,"qty");
  const sAmt = baseSaleAmt + sumBy(saleItems,"total");
  const avgS = sQty ? sAmt/sQty : 0;
  const pendingQty = pendingQtyForCat(cat.id);
  const stock = pQty - sQty - pendingQty;
  const stockValue = avgP*stock;
  const newSalesProfit = saleItems.reduce((s,x)=> s + ((Number(x.price)||0) - avgP) * (Number(x.qty)||0), 0);
  const profit = b.profit + newSalesProfit;
  const result = {pQty,pAmt,avgP,sQty,sAmt,avgS,stock,stockValue,profit, purchaseItems, saleItems, pendingQty};
  _catTotalsCache[cat.id] = result;
  return result;
}
function allCatTotals(){ return state.categories.map(c=>({cat:c, t:catTotals(c)})); }
function globalTotals(){
  const all = allCatTotals();
  return {
    purchaseAmount: all.reduce((s,x)=>s+x.t.pAmt,0),
    saleAmount: all.reduce((s,x)=>s+x.t.sAmt,0),
    profit: all.reduce((s,x)=>s+x.t.profit,0),
    stockValue: all.reduce((s,x)=>s+x.t.stockValue,0),
  };
}

function invoiceFlowForAccount(key){
  let out=0, inn=0;
  state.purchaseInvoices.forEach(inv=>{
    inv.payments.forEach(p=>{ if(p.account===key) out += Number(p.amount)||0; });
  });
  state.salesInvoices.forEach(inv=>{
    inv.payments.forEach(p=>{
      if(p.account===key){
        let amt = Number(p.amount)||0;
        if(key==='card' && inv.cardFeeApplied) amt -= (Number(inv.cardFeeAmount)||0);
        inn += amt;
      }
    });
  });
  state.pendingInvoices.forEach(inv=>{
    if(inv.status==="pending" || !inv.payments) return;
    inv.payments.forEach(p=>{
      if(p.account===key){
        let amt = Number(p.amount)||0;
        if(key==='card' && inv.cardFeeApplied) amt -= (Number(inv.cardFeeAmount)||0);
        inn += amt;
      }
    });
  });
  return inn-out;
}
function expensesFlowForAccount(key){
  let out=0;
  state.accounts.expenses.entries.forEach(e=>{ if((e.account||"cash")===key) out += Number(e.amount)||0; });
  return -out;
}
function deliveryFlowForAccount(key){
  let inn=0;
  state.accounts.delivery.entries.forEach(e=>{ if((e.account||"cash")===key) inn += Number(e.amount)||0; });
  return inn;
}
function cashWithdrawnFlowForAccount(key){
  let out=0, inn=0;
  state.accounts.cashWithdrawn.withdrawals.forEach(w=>{ if((w.account||"cash")===key) out += Number(w.amount)||0; });
  state.accounts.cashWithdrawn.repayments.forEach(r=>{ if((r.account||"cash")===key) inn += Number(r.amount)||0; });
  return inn-out;
}
function internalTransferFlowForAccount(key){
  let out=0, inn=0;
  (state.internalTransfers||[]).forEach(t=>{
    if(t.fromAccount===key) out += Number(t.amount)||0;
    if(t.toAccount===key) inn += Number(t.amount)||0;
  });
  return inn-out;
}
function accountBalance(key){
  const acc = state.accounts[key];
  let manual = 0;
  if(key==="cash"){ manual = sumBy(acc.income,"amount") - sumBy(acc.fees,"amount"); }
  else if(key==="card"){ manual = sumBy(acc.income,"amount") - sumBy(acc.fees,"amount"); }
  else if(key==="transfers"){ manual = sumBy(acc.orders,"amount") + sumBy(acc.income,"amount") - sumBy(acc.outgoing,"amount") - sumBy(acc.fees,"amount"); }
  const flow = invoiceFlowForAccount(key) + expensesFlowForAccount(key) + cashWithdrawnFlowForAccount(key) + deliveryFlowForAccount(key) + internalTransferFlowForAccount(key);
  return (acc.base.opening||0) + manual + flow;
}
function accountLedger(key){
  const items = [];
  const acc = state.accounts[key];
  const push = (date, label, amount)=> items.push({date: date||"-", label, amount});
  if(key==="cash"){
    acc.income.forEach(e=> push(e.date, `دخول: ${e.type||"دخول كاش"}`, Number(e.amount)||0));
    acc.fees.forEach(e=> push(e.date, `خصم/عمولة: ${e.type||""}`, -(Number(e.amount)||0)));
  } else if(key==="card"){
    acc.income.forEach(e=> push(e.date, `مدخول البطاقة${e.notes?": "+e.notes:""}`, Number(e.amount)||0));
    acc.fees.forEach(e=> push(e.date, `خصم/عمولة: ${e.type||""}`, -(Number(e.amount)||0)));
  } else if(key==="transfers"){
    acc.orders.forEach(e=> push(e.date, `حوالة طلبية${e.address?" - "+e.address:""}`, Number(e.amount)||0));
    acc.income.forEach(e=> push(e.date, `دخول: ${e.type||""}`, Number(e.amount)||0));
    acc.outgoing.forEach(e=> push(e.date, `خروج: ${e.notes||""}`, -(Number(e.amount)||0)));
    acc.fees.forEach(e=> push(e.date, `خصم/عمولة: ${e.type||""}`, -(Number(e.amount)||0)));
  }
  state.purchaseInvoices.forEach(inv=>{
    inv.payments.forEach(p=>{ if(p.account===key) push(inv.date, `فاتورة شراء #${inv.number}${inv.seller?" - "+inv.seller:""}`, -(Number(p.amount)||0)); });
  });
  state.salesInvoices.forEach(inv=>{
    inv.payments.forEach(p=>{
      if(p.account===key){
        let amt = Number(p.amount)||0;
        let label = `فاتورة بيع ${cityGroupLabel(inv.cityGroup)} #${inv.number}`;
        if(key==='card' && inv.cardFeeApplied){ amt -= (Number(inv.cardFeeAmount)||0); label += ` (بعد خصم عمولة ${fmtNum(inv.cardFeeAmount)})`; }
        push(inv.date, label, amt);
      }
    });
  });
  state.pendingInvoices.forEach(inv=>{
    if(inv.status==="pending" || !inv.payments) return;
    inv.payments.forEach(p=>{
      if(p.account===key){
        let amt = Number(p.amount)||0;
        let label = `فاتورة بيع ${cityGroupLabel(inv.cityGroup)} #${inv.number}`;
        if(key==='card' && inv.cardFeeApplied){ amt -= (Number(inv.cardFeeAmount)||0); label += ` (بعد خصم عمولة ${fmtNum(inv.cardFeeAmount)})`; }
        push(inv.resolvedDate||inv.date, label, amt);
      }
    });
  });
  state.accounts.expenses.entries.forEach(e=>{ if((e.account||"cash")===key) push(e.date, `مصروف مشروع: ${e.type||""}`, -(Number(e.amount)||0)); });
  state.accounts.delivery.entries.forEach(e=>{ if((e.account||"cash")===key) push(e.date, `توصيل`, Number(e.amount)||0); });
  state.accounts.cashWithdrawn.withdrawals.forEach(w=>{ if((w.account||"cash")===key) push(w.date, `سحب شخصي${w.notes?": "+w.notes:""}`, -(Number(w.amount)||0)); });
  state.accounts.cashWithdrawn.repayments.forEach(r=>{ if((r.account||"cash")===key) push(r.date, `سداد${r.notes?": "+r.notes:""}`, Number(r.amount)||0); });
  (state.internalTransfers||[]).forEach(t=>{
    if(t.fromAccount===key) push(t.date, `تحويل إلى ${ACCOUNT_LABELS[t.toAccount]}${t.notes?": "+t.notes:""}`, -(Number(t.amount)||0));
    if(t.toAccount===key) push(t.date, `تحويل من ${ACCOUNT_LABELS[t.fromAccount]}${t.notes?": "+t.notes:""}`, Number(t.amount)||0);
  });
  items.sort((a,b)=> (b.date||"").localeCompare(a.date||""));
  return items;
}
function deliveryTotal(){ const a = state.accounts.delivery; return a.base.total + sumBy(a.entries,"amount"); }
function expensesTotal(){ const a = state.accounts.expenses; return a.base.total + sumBy(a.entries,"amount"); }
function cashWithdrawnRemaining(){
  const a = state.accounts.cashWithdrawn;
  const withdrawn = a.base.withdrawn + sumBy(a.withdrawals,"amount");
  const repaid = a.base.repaid + sumBy(a.repayments,"amount");
  return {withdrawn, repaid, remaining: withdrawn-repaid};
}

function svgBarChart(labels, values, color){
  const w = 640, h = 190, pad = 28;
  const max = Math.max(1, ...values);
  const n = Math.max(1, values.length);
  const gap = (w - pad*2) / n;
  const barW = Math.min(46, gap*0.6);
  const bars = values.map((v,i)=>{
    const barH = max>0 ? (v/max) * (h - pad*2) : 0;
    const x = pad + i*gap + (gap-barW)/2;
    const y = h - pad - barH;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(1,barH).toFixed(1)}" rx="4" fill="${color}"/>
      <text x="${(x+barW/2).toFixed(1)}" y="${h-pad+15}" font-size="9.5" text-anchor="middle" fill="#75695A">${esc(labels[i])}</text>
      <text x="${(x+barW/2).toFixed(1)}" y="${(y-5).toFixed(1)}" font-size="9.5" text-anchor="middle" fill="#2B2620">${fmtNum(v)}</text>`;
  }).join("");
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px;" preserveAspectRatio="xMidYMid meet">${bars}</svg>`;
}

function buildCatListHtml(){
  const term = (productSearchTerm||"").trim();
  let listHtml = state.families.map(fam=>{
    const subs = state.subs.filter(s=>s.familyId===fam.id);
    let famHtml = "";
    subs.forEach(sub=>{
      const items = state.categories.filter(c=>c.subId===sub.id)
        .filter(c=> !term || c.name.includes(term) || fam.name.includes(term) || sub.name.includes(term))
        .filter(c=> catMatchesFilterMode(c, shortageFilterMode));
      if(!items.length) return;
      famHtml += `<div class="cat-group-title">${esc(fam.name)} ↳ ${esc(sub.name)}</div>
      ${items.map(c=>{ const t = catTotals(c);
        const short = catHasShortage(c);
        return `<div class="cat-item ${c.id===currentCatId?'active':''}" onclick="openCategory('${c.id}')"><span>${short?'⚠ ':''}${esc(c.name)}</span><small>مخزون ${fmtNum(t.stock)}</small></div>`;
      }).join("")}`;
    });
    return famHtml;
  }).join("");
  if(!listHtml) listHtml = `<div class="empty-row">${shortageFilterMode!=="all" ? "لا توجد أصناف مطابقة لهذا الفلتر 🎉" : "لا توجد أصناف مطابقة للبحث"}</div>`;
  return listHtml;
}
function searchProducts(v){ productSearchTerm = v; const el = document.getElementById("catListContainer"); if(el) el.innerHTML = buildCatListHtml(); }

function moveItemUp(id){
  const idx = state.categories.findIndex(c=>c.id===id);
  if(idx<=0) return;
  const cat = state.categories[idx];
  for(let i=idx-1;i>=0;i--){
    if(state.categories[i].subId===cat.subId){
      [state.categories[idx], state.categories[i]] = [state.categories[i], state.categories[idx]];
      break;
    }
  }
  saveState(); render();
  autoRepublishIfNeeded(id);
}
function moveItemDown(id){
  const idx = state.categories.findIndex(c=>c.id===id);
  if(idx<0 || idx>=state.categories.length-1) return;
  const cat = state.categories[idx];
  for(let i=idx+1;i<state.categories.length;i++){
    if(state.categories[i].subId===cat.subId){
      [state.categories[idx], state.categories[i]] = [state.categories[i], state.categories[idx]];
      break;
    }
  }
  saveState(); render();
  autoRepublishIfNeeded(id);
}

  state.categories = state.categories.filter(c=>c.id!==id);

async function executeQuantityTransfer(){
  const fromId = document.getElementById("xfer_from_cat").value;
  const toId = document.getElementById("xfer_to_cat").value;
  const fromColorEl = document.getElementById("xfer_from_color");
  const toColorEl = document.getElementById("xfer_to_color");
  const fromColor = fromColorEl ? fromColorEl.value : "";
  const toColor = toColorEl ? toColorEl.value : "";
  const qty = parseFloat(document.getElementById("xfer_qty").value);

  if(!fromId || !toId){ alert("اختر الصنف المصدر والوجهة"); return; }
  const fromCat = state.categories.find(c=>c.id===fromId);
  const toCat = state.categories.find(c=>c.id===toId);
  if(!fromCat || !toCat) return;
  if(fromCat.colors && !fromColor){ alert("يجب اختيار لون للصنف المصدر لأنه يتتبع الألوان"); return; }
  // If the source is color-specific, the destination must also receive a color name —
  // even if the destination category doesn't track colors yet (e.g. a brand-new item).
  if(fromColor && !toColor){ alert("يجب تحديد لون للوجهة أيضاً"); return; }
  if(toCat.colors && !toColor){ alert("يجب اختيار لون للصنف الوجهة لأنه يتتبع الألوان"); return; }
  if(fromId===toId && fromColor===toColor){ alert("لا يمكن النقل لنفس الصنف واللون"); return; }
  if(!qty || qty<=0){ alert("أدخل كمية صحيحة"); return; }

  const available = itemAvailableQty(fromId, fromColor);
  if(qty > available){ alert(`الكمية المتوفرة في المصدر فقط ${fmtNum(available)}`); return; }

  const fromLabel = `${catFullLabel(fromCat)}${fromColor?" ("+fromColor+")":""}`;
  const toLabel = `${catFullLabel(toCat)}${toColor?" ("+toColor+")":""}`;
  if(!(await showCustomConfirm(`نقل ${fmtNum(qty)} قطعة من "${fromLabel}" إلى "${toLabel}"؟`))) return;

  if(fromCat.colors){ fromCat.colors[fromColor] = Math.max(0, (fromCat.colors[fromColor]||0) - qty); }
  fromCat.base.purchaseQty = (fromCat.base.purchaseQty||0) - qty;

  if(toColor){
    // Destination receives a specific color — initialize its color map if this item
    // never tracked colors before (colors is null/undefined), rather than dumping
    // the quantity into aggregate stock and losing the color breakdown.
    if(!toCat.colors) toCat.colors = {};
    if(!(toColor in toCat.colors)) ensureBarcodeForItem(toCat.id, toColor);
    toCat.colors[toColor] = (toCat.colors[toColor]||0) + qty;
  }
  toCat.base.purchaseQty = (toCat.base.purchaseQty||0) + qty;

  _catTotalsCache = {}; // invalidate immediately — catTotals() below must reflect the mutation just made, not a stale cache from the page that was already on screen

  const afterFrom = fromCat.colors ? fromCat.colors[fromColor] : catTotals(fromCat).stock;
  const afterTo = toCat.colors ? toCat.colors[toColor] : catTotals(toCat).stock;

  logActivity(`نقل ${fmtNum(qty)} قطعة من "${fromLabel}" إلى "${toLabel}"`);
  xferFromColor=""; xferToColor="";
  document.getElementById("xfer_qty").value = "";
  await saveState();
  render();
  await autoRepublishIfNeeded([fromId, toId]);

/* ==================== SHORTAGES ==================== */
function shortageRows(){
  const rows = [];
  state.categories.forEach(cat=>{
    if(cat.colors && Object.keys(cat.colors).length){
      sortColorsCanonical(Object.keys(cat.colors)).forEach(color=>{
        const qty = effectiveColorQty(cat, color);
        if(qty<=1) rows.push({cat, color, qty});
      });
    } else {
      const t = catTotals(cat);
      if(t.stock<=1) rows.push({cat, color:null, qty:t.stock});
    }
  });
  rows.sort((a,b)=> a.qty-b.qty);
  return rows;
}
function catHasShortage(cat){
  if(cat.colors && Object.keys(cat.colors).length){
    return Object.keys(cat.colors).some(c=>effectiveColorQty(cat,c)<=1);
  }
  return catTotals(cat).stock<=1;
}
function catMatchesFilterMode(cat, mode){
  if(mode==="all") return true;
  if(mode==="available"){
    if(cat.colors && Object.keys(cat.colors).length){
      return Object.keys(cat.colors).some(c=>effectiveColorQty(cat,c)>=1);
    }
    return catTotals(cat).stock>=1;
  }
  const target = mode==="zero" ? 0 : 1;
  if(cat.colors && Object.keys(cat.colors).length){
    return Object.keys(cat.colors).some(c=>effectiveColorQty(cat,c)===target);
  }
  return catTotals(cat).stock===target;
}
function goToShortages(){
  shortageFilterMode = "zero";
  currentView = "products";
  const qualifying = state.categories.filter(c=>catMatchesFilterMode(c,"zero"));
  if(qualifying.length && !qualifying.some(c=>c.id===currentCatId)){ currentCatId = qualifying[0].id; }
  render();
}
function setShortageFilterMode(mode){
  shortageFilterMode = mode;
  const qualifying = state.categories.filter(c=>catMatchesFilterMode(c,mode));
  if(mode!=="all" && qualifying.length && !qualifying.some(c=>c.id===currentCatId)){ currentCatId = qualifying[0].id; }
  render();
}

function saveDraftPurchaseInvoice(){
  if(!puDraftItems.length){ alert("أضف صنفاً واحداً على الأقل للفاتورة"); return; }
  const total = puDraftTotal();
  const paid = puDraftPaid();
  if(Math.abs(total-paid) > 0.01){ alert(`إجمالي الفاتورة ${fmtNum(total)} لا يساوي إجمالي المدفوع ${fmtNum(paid)}. يرجى تعديل طرق الدفع.`); return; }
  const date = document.getElementById("pu_date").value || todayStr();
  const seller = document.getElementById("pu_seller").value;

  if(editingPurchaseInvoiceId){
    const idx = state.purchaseInvoices.findIndex(i=>i.id===editingPurchaseInvoiceId);
    if(idx>=0){
      const old = state.purchaseInvoices[idx];
      old.items.forEach(it=>{
        if(it.color){
          const cat = state.categories.find(c=>c.id===it.catId);
          if(cat && cat.colors && cat.colors[it.color]!==undefined) cat.colors[it.color] -= it.qty;
        }
      });
      const updated = { id: old.id, number: old.number, date, seller, items: puDraftItems.slice(), totalAmount: total, payments: puDraftPayments.slice() };
      state.purchaseInvoices[idx] = updated;
      updated.items.forEach(it=>{
        if(it.color){
          const cat = state.categories.find(c=>c.id===it.catId);
          if(!cat.colors) cat.colors = {};
          cat.colors[it.color] = (cat.colors[it.color]||0) + it.qty;
        }
      });
      logActivity(`تعديل فاتورة شراء #${updated.number}`);
      editingPurchaseInvoiceId = null; puEditDate = null; puEditSeller = null;
    }
  } else {
    const invoice = { id:"pinv_"+Math.random().toString(36).slice(2), number: state.nextPurchaseInvoiceNo++, date, seller,
      items: puDraftItems.slice(), totalAmount: total, payments: puDraftPayments.slice() };
    state.purchaseInvoices.push(invoice);
    invoice.items.forEach(it=>{
      if(it.color){
        const cat = state.categories.find(c=>c.id===it.catId);
        if(!cat.colors) cat.colors = {};
        cat.colors[it.color] = (cat.colors[it.color]||0) + it.qty;
      }
    });
    logActivity(`فاتورة شراء #${invoice.number} — ${invoice.items.length} صنف بإجمالي ${fmtNum(total)}`);
  }
  puDraftItems = []; puDraftPayments = [];
  puEditDate = null; puEditSeller = null;
  saveState(); render();
}

  const inv = state.purchaseInvoices.find(i=>i.id===id);
  if(!inv) return;
  editingPurchaseInvoiceId = id;
  puDraftItems = inv.items.map(it=>Object.assign({},it));
  puDraftPayments = inv.payments.map(p=>Object.assign({},p));
  puEditDate = inv.date; puEditSeller = inv.seller;
  render();
}
function cancelEditPurchase(){
  editingPurchaseInvoiceId = null; puDraftItems = []; puDraftPayments = []; puEditDate = null; puEditSeller = null;
  render();
}
function deletePurchaseInvoice(id){
  const inv = state.purchaseInvoices.find(i=>i.id===id);
  if(!inv) return;
  inv.items.forEach(it=>{
    if(it.color){
      const cat = state.categories.find(c=>c.id===it.catId);
      if(cat && cat.colors && cat.colors[it.color]!==undefined) cat.colors[it.color] -= it.qty;
    }
  });
  state.purchaseInvoices = state.purchaseInvoices.filter(i=>i.id!==id);
  if(inv.number === state.nextPurchaseInvoiceNo - 1){ state.nextPurchaseInvoiceNo = inv.number; }
  logActivity(`حذف فاتورة شراء #${inv.number}`);
  saveState(); render();
}

/* ==================== SALES PAGE (multi-item invoice) ==================== */
function allSalesRecordsForDisplay(){
  const records = [];
  state.salesInvoices.forEach(inv=> records.push({
    number: inv.number, cityGroup: inv.cityGroup, date: inv.date, phone1: inv.phone1, phone2: inv.phone2, city: inv.city,
    zone: inv.zone, otherCityName: inv.otherCityName, otherZone: inv.otherZone,
    totalAmount: inv.totalAmount, payments: inv.payments, cardFeeApplied: inv.cardFeeApplied, cardFeeAmount: inv.cardFeeAmount,
    items: inv.items, source: "مباشرة", statusLabel: null
  }));
  state.pendingInvoices.forEach(inv=>{
    if(inv.status==="pending" || inv.status==="shortage") return;
    const soldItems = inv.items.filter(it=>(it.soldQty||0)>0);
    records.push({
      id: inv.id, number: inv.number, cityGroup: inv.cityGroup, date: inv.resolvedDate||inv.date, phone1: inv.phone1, phone2: inv.phone2, city: inv.city,
      zone: inv.zone, otherCityName: inv.otherCityName, otherZone: inv.otherZone,
      totalAmount: soldItems.reduce((s,it)=>s+Math.round(it.price*it.soldQty*100)/100,0),
      payments: inv.payments||[], cardFeeApplied: inv.cardFeeApplied, cardFeeAmount: inv.cardFeeAmount,
      items: soldItems.map(it=>({catName:it.catName, color:it.color, price:it.price, qty:it.soldQty, total:Math.round(it.price*it.soldQty*100)/100})),
      source: "فاتورة مبدئية", statusLabel: inv.status==="returned" ? "مرتجعة بالكامل" : (inv.returnedNote && inv.returnedNote.startsWith("مرتجع جزئي") ? "مرتجع جزئي" : null)
    });
  });
  records.sort((a,b)=> (b.date||"").localeCompare(a.date||"") || b.number-a.number);
  return records;
}
function renderSalesPage(){
  const rs = renderResolveScreen();

      return `
      <tr><td><span class="invoice-badge">${cityGroupLabel(r.cityGroup)} #${r.number}</span></td><td>${fmtDate(r.date)}</td><td>${esc(r.phone1||"-")}${r.phone2?" / "+esc(r.phone2):""}</td>
        <td>${esc(loc.city)}</td><td>${esc(loc.zone)}</td><td>${esc(loc.address)}</td>
        <td>${fmtNum(qty)}</td><td>${fmt(r.totalAmount)}</td><td>${esc(paymentsSummary(r.payments))}${r.cardFeeApplied?` <span class="tag">عمولة ${fmtNum(r.cardFeeAmount)}</span>`:""}</td>
        <td>${r.statusLabel ? `<span class="tag" style="background:var(--danger-soft);color:var(--danger);">${r.statusLabel}</span>` : `<span class="tag teal">مكتملة</span>`}</td>
        <td><details><summary>عرض (${r.items.length})</summary><ul>${r.items.map(it=>`<li>${esc(it.catName)}${it.color?" — "+esc(it.color):""}: ${fmtNum(it.qty)} × ${fmtNum(it.price)} = ${fmtNum(it.total)}</li>`).join("")}</ul></details></td>
        <td style="display:flex;gap:6px;flex-wrap:wrap;">${editButtons}<button class="btn ghost viewer-safe" onclick="printSalesRecord(${r.number}, '${r.cityGroup}')">🖨 طباعة</button></td></tr>`;
    }).join("") || `<tr><td colspan="11" class="empty-row">لا توجد فواتير في هذا التصنيف بعد</td></tr>`;

      <table><thead><tr><th>الفاتورة</th><th>التاريخ</th><th>الهاتف</th><th>المدينة</th><th>المنطقة</th><th>العنوان</th><th>عدد القطع</th><th>الإجمالي</th><th>طريقة الدفع</th><th>الحالة</th><th>الأصناف</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table>
    </div>`;
  };

  return `
    <div class="section">
      <div class="section-title">💳 فواتير المبيعات (سجل الفواتير المسوّاة)</div>
      <div class="section-hint">هذا السجل هو فواتير البيع الفعلية — كل فاتورة تُصدر من صفحة "فواتير مبدئية" بعد تسويتها، وتحمل نفس رقم الفاتورة المبدئية دائماً حتى لو تغيّر المرتجع لاحقاً. لتعديل فاتورة بعد التسوية اضغط "تعديل التسوية" أو "تعديل كامل". كل تصنيف معروض بجدوله المستقل.</div>

/* ==================== PENDING / PRELIMINARY INVOICES — sole source of sales ==================== */
function pdDraftTotal(){ return pdDraftItems.reduce((s,i)=>s+i.total,0); }
function addDraftPendingItem(){
  const catId = document.getElementById("pd_item_cat").value;
  const cat = state.categories.find(c=>c.id===catId);
  const color = document.getElementById("pd_item_color").value;
  const price = parseFloat(document.getElementById("pd_item_price").value);
  const qty = parseFloat(document.getElementById("pd_item_qty").value);
  if(!price || price<=0 || !qty || qty<=0){ alert("يرجى إدخال سعر القطعة والعدد للبند (قيمة موجبة أكبر من صفر)"); return; }
  pdDraftItems.push({catId, catName:cat.name, color, price, qty, total: Math.round(price*qty*100)/100});
  render();
}
function removeDraftPendingItem(idx){ pdDraftItems.splice(idx,1); render(); }
function savePendingInvoice(){
  if(!pdDraftItems.length){ alert("أضف صنفاً واحداً على الأقل"); return; }
  const date = document.getElementById("pd_date").value || todayStr();
  const phone1 = document.getElementById("pd_phone1").value;
  const phone2 = document.getElementById("pd_phone2").value;
  const cityGroup = document.getElementById("pd_cityGroup").value;
  const zoneEl = document.getElementById("pd_zone");
  const deliveryPriceEl = document.getElementById("pd_deliveryPrice");
  const zone = cityGroup==="tripoli" && zoneEl ? zoneEl.value : "";
  const deliveryPrice = cityGroup==="tripoli" && deliveryPriceEl ? (parseFloat(deliveryPriceEl.value)||0) : 0;
  const otherCityNameEl = document.getElementById("pd_otherCityName");
  const otherCityName = cityGroup==="other" && otherCityNameEl ? otherCityNameEl.value : "";
  const otherZoneEl = document.getElementById("pd_otherZone");
  const otherZone = cityGroup==="other" && otherZoneEl ? otherZoneEl.value : "";
  const city = document.getElementById("pd_city").value;
  const notes = document.getElementById("pd_notes").value;

  if(editingPendingId){
    const inv = state.pendingInvoices.find(i=>i.id===editingPendingId);
    if(inv){
      const wasSettled = inv.status==="resolved" || inv.status==="returned";
      if(wasSettled){
        inv.items.forEach(oldIt=>{
          const sold = oldIt.soldQty||0;
          if(sold>0 && oldIt.color){
            const cat = state.categories.find(c=>c.id===oldIt.catId);
            if(cat && cat.colors && cat.colors[oldIt.color]!==undefined) cat.colors[oldIt.color] += sold;
          }
        });
      }
      inv.date = date; inv.phone1 = phone1; inv.phone2 = phone2; inv.city = city; inv.notes = notes;
      inv.zone = zone; inv.deliveryPrice = deliveryPrice; inv.otherCityName = otherCityName; inv.otherZone = otherZone;
      inv.items = pdDraftItems.map(it=>Object.assign({}, it, {soldQty:null}));
      inv.totalAmount = pdDraftTotal();
      const check = checkPendingStockAvailability(inv.items);
      inv.status = check.ok ? "pending" : "shortage";
      if(wasSettled){
        inv.payments = [];
        inv.cardFeeApplied = false;
        inv.cardFeeAmount = 0;
        inv.resolvedDate = null;
        inv.returnedNote = "";
        logActivity(`تعديل كامل للفاتورة ${cityGroupLabel(inv.cityGroup)} #${inv.number} بعد التسوية — رجعت "معلقة" وتحتاج تسوية جديدة`);
      } else {
        logActivity(`تعديل الفاتورة ${cityGroupLabel(inv.cityGroup)} #${inv.number}${check.ok?"":" (بها نواقص في المخزون)"}`);
      }
      editingPendingId = null;
    }
  } else {
    const number = cityGroup==="tripoli" ? state.nextPendingInvoiceNoTripoli++ : state.nextPendingInvoiceNoOther++;
    const items = pdDraftItems.map(it=>Object.assign({}, it, {soldQty:null}));
    const check = checkPendingStockAvailability(items);
    const invoice = {
      id:"pdinv_"+Math.random().toString(36).slice(2), number, cityGroup,
      date, phone1, phone2, city, notes, zone, deliveryPrice, otherCityName, otherZone, deliveryAccountAssigned: null,
      courierType: null, courierName: "", deliveryStage: "pending", courierResolution: null,
      items,
      totalAmount: pdDraftTotal(),
      status: check.ok ? "pending" : "shortage", payments: [], cardFeeApplied:false, cardFeeAmount:0, resolvedDate:null, returnedNote:""
    };
    state.pendingInvoices.push(invoice);
    logActivity(`فاتورة #${invoice.number} (${cityGroupLabel(cityGroup)}) — ${invoice.items.length} صنف بإجمالي ${fmtNum(invoice.totalAmount)}${check.ok?"":" — بها نواقص في المخزون، لم يُحجز شيء"}`);
  }
  pdDraftItems = [];
  pdDraftDate = null; pdDraftCityGroup = "tripoli"; pdDraftPhone1 = ""; pdDraftPhone2 = ""; pdDraftZone = ""; pdDraftDeliveryPrice = ""; pdDraftOtherCityName = ""; pdDraftOtherZone = ""; pdDraftCity = ""; pdDraftNotes = "";
  saveState(); render();
}
function editPendingInvoice(id){
  const inv = state.pendingInvoices.find(i=>i.id===id);
  if(!inv) return;
  editingPendingId = id;
  pdDraftItems = inv.items.map(it=>({catId:it.catId, catName:it.catName, color:it.color, price:it.price, qty:it.qty, total: Math.round((it.price||0)*(it.qty||0)*100)/100}));
  pdDraftDate = inv.date; pdDraftCityGroup = inv.cityGroup; pdDraftPhone1 = inv.phone1||""; pdDraftPhone2 = inv.phone2||"";
  pdDraftZone = inv.zone||""; pdDraftDeliveryPrice = inv.deliveryPrice||""; pdDraftOtherCityName = inv.otherCityName||""; pdDraftOtherZone = inv.otherZone||""; pdDraftCity = inv.city; pdDraftNotes = inv.notes;
  render();
}
function cancelEditPending(){
  editingPendingId = null; pdDraftItems = [];
  pdDraftDate = null; pdDraftCityGroup = "tripoli"; pdDraftPhone1 = ""; pdDraftPhone2 = ""; pdDraftZone = ""; pdDraftDeliveryPrice = ""; pdDraftOtherCityName = ""; pdDraftOtherZone = ""; pdDraftCity = ""; pdDraftNotes = "";
  render();
}
async function deletePendingInvoice(id){
  if(!(await showCustomConfirm("حذف هذه الفاتورة نهائياً؟ (ستعود أي كمية محجوزة أو مباعة ضمنها إلى المخزون المتاح)"))) return;
  const inv = state.pendingInvoices.find(i=>i.id===id);
  if(inv){
    inv.items.forEach(it=>{
      const sold = it.soldQty||0;
      if(sold>0 && it.color){
        const cat = state.categories.find(c=>c.id===it.catId);
        if(cat && cat.colors && cat.colors[it.color]!==undefined) cat.colors[it.color] += sold;
      }
    });
    state.pendingInvoices = state.pendingInvoices.filter(i=>i.id!==id);
    const counterKey = inv.cityGroup==="tripoli" ? "nextPendingInvoiceNoTripoli" : "nextPendingInvoiceNoOther";
    if(inv.number === state[counterKey] - 1){ state[counterKey] = inv.number; }
  }
  saveState(); render();
}

  assignCourierType = "owner";

}

  render();
}
function onAssignSelectedChange(val){

}
async function confirmAssignCourier(){
  const inv = state.pendingInvoices.find(i=>i.id===assigningInvoiceId);
  if(!inv) return;
  const type = document.getElementById("ac_type").value;
  let courierName = "";
  if(type==="rep" || type==="company"){
    const list = type==="rep" ? state.deliveryReps : state.deliveryCompanies;
    const selEl = document.getElementById("ac_selected");
    const selected = selEl ? selEl.value : "";
    if(selected==="__new__"){
      const nameEl = document.getElementById("ac_new_name");
      const name = nameEl ? nameEl.value.trim() : "";
      if(!name){ alert(type==="rep" ? "يرجى إدخال اسم المندوب" : "يرجى إدخال اسم شركة التوصيل"); return; }
      if(type==="rep"){
        const pinEl = document.getElementById("ac_new_pin");
        const pin = pinEl ? pinEl.value.trim() : "";
        if(!/^\d{4}$/.test(pin)){ alert("يرجى إدخال رقم سري مكوّن من 4 أرقام بالضبط للمندوب"); return; }
        if(state.deliveryReps.some(r=>r.pin===pin)){ alert("هذا الرقم السري مستخدم من مندوب آخر — اختر رقماً مختلفاً"); return; }
        state.deliveryReps.push({id:"rep_"+Date.now()+Math.random().toString(36).slice(2,6), name, pin});
      } else {
        state.deliveryCompanies.push({id:"co_"+Date.now()+Math.random().toString(36).slice(2,6), name});
      }
      courierName = name;
    } else if(selected){
      const entry = list.find(x=>x.id===selected);
      if(!entry){ alert("يرجى اختيار من القائمة"); return; }
      if(type==="rep" && !entry.pin){
        const pinEl = document.getElementById("ac_new_pin");
        const pin = pinEl ? pinEl.value.trim() : "";
        if(!/^\d{4}$/.test(pin)){ alert("يرجى إدخال رقم سري مكوّن من 4 أرقام بالضبط لهذا المندوب"); return; }
        if(state.deliveryReps.some(r=>r.pin===pin)){ alert("هذا الرقم السري مستخدم من مندوب آخر — اختر رقماً مختلفاً"); return; }
        entry.pin = pin;
      }
      courierName = entry.name;
    } else {
      alert(type==="rep" ? "يرجى اختيار مندوب" : "يرجى اختيار شركة توصيل");
      return;
    }
  }
  inv.courierType = type;
  inv.courierName = courierName;
  inv.deliveryStage = "in_delivery";
  logActivity(`تحويل الفاتورة #${inv.number} للتوصيل مع ${type==="owner"?"صاحب المتجر بهاء":courierName}`);
  assigningInvoiceId = null; assignCourierType = "owner"; assignSelectedId = ""; assignNewName = ""; assignNewPin = "";
  await saveState();
  render();
  await autoPublishCourierInvoices();
}

let manualSettleInvoiceId = null;
function startCourierManualSettle(id){
  if(currentRole==="viewer"){ alert("وضع المشاهدة فقط لا يسمح بتسجيل التسليم."); return; }
  manualSettleInvoiceId = id;
  const inv = state.pendingInvoices.find(i=>i.id===id);
  resolveDraftItems = inv.items.map(it=>Object.assign({}, it, {soldQty: it.qty}));
  resolveDraftPayments = [];
  render();
}
function cancelCourierManualSettle(){
  manualSettleInvoiceId = null; resolveDraftItems = []; resolveDraftPayments = [];
  render();
}
async function confirmCourierManualSettle(){
  const inv = state.pendingInvoices.find(i=>i.id===manualSettleInvoiceId);
  if(!inv) return;
  const deliveryPriceFinal = parseFloat(document.getElementById("cms_delivery_price").value)||0;
  inv.courierResolution = {
    items: resolveDraftItems.map(it=>({catId:it.catId, color:it.color, soldQty:it.soldQty, price:it.price})),
    payments: resolveDraftPayments.slice(),
    deliveryPriceFinal,
    settledDate: todayStr()
  };
  inv.deliveryStage = "delivered";
  logActivity(`تسجيل تسليم الفاتورة #${inv.number} يدوياً — بانتظار التسوية النهائية`);
  manualSettleInvoiceId = null; resolveDraftItems = []; resolveDraftPayments = [];
  await saveState();
  render();
  await autoPublishCourierInvoices();
}
function startResolvePending(id){
  if(currentRole==="viewer"){ alert("وضع المشاهدة فقط لا يسمح بتسوية الفواتير المبدئية."); return; }
  const inv = state.pendingInvoices.find(i=>i.id===id);
  if(!inv) return;
  if(inv.status==="shortage"){
    const check = checkPendingStockAvailability(inv.items);
    if(!check.ok){
      const lines = check.details.filter(d=>!d.ok).map(d=>`${d.catName}${d.color?" ("+d.color+")":""}: مطلوب ${fmtNum(d.qty)} — متوفر ${fmtNum(d.available)}`);
      alert("لا يزال هناك نقص في المخزون، لا يمكن اعتماد الفاتورة كبيع بعد:\n" + lines.join("\n"));
      render();
      return;
    }
    inv.status = "pending";
    logActivity(`اكتمل مخزون الفاتورة #${inv.number} — أصبحت معلقة عادية وتم حجز الكمية`);
    saveState();
  }
  resolvingPendingId = id;
  if(inv.courierResolution){
    const cr = inv.courierResolution;
    resolveDraftItems = inv.items.map(it=>{
      const crIt = cr.items.find(x=>x.catId===it.catId && x.color===it.color);
      return Object.assign({}, it, {soldQty: crIt ? crIt.soldQty : (it.soldQty===null||it.soldQty===undefined ? it.qty : it.soldQty)});
    });
    resolveDraftPayments = (cr.payments||[]).map(p=>Object.assign({}, p));
    resolveDeliveryAccount = inv.deliveryAccountAssigned || "cash";
  } else {
    resolveDraftItems = inv.items.map(it=>Object.assign({}, it, {soldQty: (it.soldQty===null||it.soldQty===undefined) ? it.qty : it.soldQty}));
    resolveDraftPayments = (inv.payments||[]).map(p=>Object.assign({}, p));
    resolveDeliveryAccount = inv.deliveryAccountAssigned || "cash";
  }
  render();
}
function cancelResolvePending(){
  resolvingPendingId = null; resolveDraftItems = []; resolveDraftPayments = []; resolveDeliveryAccount = "cash";
  render();
}
function setResolveSoldQty(idx, val){
  const it = resolveDraftItems[idx];
  let q = parseFloat(val);
  if(isNaN(q) || q<0) q = 0;
  if(q>it.qty) q = it.qty;
  it.soldQty = q;
  render();
}
function resolveSoldTotal(){ return resolveDraftItems.reduce((s,it)=>s+(it.price*it.soldQty),0); }
function addResolvePayment(){
  const account = document.getElementById("rs_pay_account").value;
  const amount = parseFloat(document.getElementById("rs_pay_amount").value);
  if(!amount){ alert("يرجى إدخال قيمة الدفع"); return; }
  resolveDraftPayments.push({account, amount});
  render();
}
function removeResolvePayment(idx){ resolveDraftPayments.splice(idx,1); render(); }
function finalizePendingInvoice(){
  const pending = state.pendingInvoices.find(i=>i.id===resolvingPendingId);
  if(!pending) return;
  const soldTotal = Math.round(resolveSoldTotal()*100)/100;
  const paid = Math.round(resolveDraftPayments.reduce((s,p)=>s+(Number(p.amount)||0),0)*100)/100;
  const anySold = resolveDraftItems.some(it=>it.soldQty>0);

  if(!anySold){
    pending.items.forEach((oldIt,i)=>{
      const prevSold = oldIt.soldQty||0;
      if(prevSold>0 && oldIt.color){
        const cat = state.categories.find(c=>c.id===oldIt.catId);
        if(cat && cat.colors && cat.colors[oldIt.color]!==undefined) cat.colors[oldIt.color] += prevSold;
      }
    });
    pending.items = resolveDraftItems.map(it=>({catId:it.catId, catName:it.catName, color:it.color, price:it.price, qty:it.qty, soldQty:0}));
    pending.status = "returned";
    pending.payments = []; pending.cardFeeApplied = false; pending.cardFeeAmount = 0;
    pending.resolvedDate = todayStr();
    pending.returnedNote = "تم إرجاع الفاتورة بالكامل — لا يوجد بيع، والكمية عادت إلى المخزون المتاح";
    logActivity(`إرجاع الفاتورة #${pending.number} بالكامل`);
    resolvingPendingId = null; resolveDraftItems = []; resolveDraftPayments = []; resolveDeliveryAccount = "cash";
    saveState(); render();
    autoPublishCourierInvoices();
    return;
  }
  if(Math.abs(soldTotal-paid) > 0.01){ alert(`إجمالي المُباع فعلياً ${fmtNum(soldTotal)} لا يساوي إجمالي المدفوع ${fmtNum(paid)}. يرجى تعديل طرق الدفع.`); return; }

  resolveDraftItems.forEach((newIt, i)=>{
    const oldIt = pending.items[i];
    const oldSold = (oldIt && oldIt.soldQty) ? oldIt.soldQty : 0;
    const delta = newIt.soldQty - oldSold;
    if(delta!==0 && newIt.color){
      const cat = state.categories.find(c=>c.id===newIt.catId);
      if(cat){
        if(!cat.colors) cat.colors = {};
        cat.colors[newIt.color] = (cat.colors[newIt.color]||0) - delta;
      }
    }
  });

  const cardPortion = resolveDraftPayments.filter(p=>p.account==='card').reduce((s,p)=>s+(Number(p.amount)||0),0);
  const cardFeeAmount = Math.round(cardPortion*0.01*100)/100;
  const cardFeeApplied = cardPortion>0;

  pending.items = resolveDraftItems.map(it=>({catId:it.catId, catName:it.catName, color:it.color, price:it.price, qty:it.qty, soldQty:it.soldQty}));
  pending.payments = resolveDraftPayments.slice();
  pending.cardFeeApplied = cardFeeApplied;
  pending.cardFeeAmount = cardFeeAmount;
  pending.status = "resolved";
  pending.resolvedDate = todayStr();
  const returnedItems = pending.items.filter(it=>it.qty>it.soldQty).map(it=>`${it.catName}${it.color?" ("+it.color+")":""}: أُرجع ${fmtNum(it.qty-it.soldQty)} من ${fmtNum(it.qty)}`);
  pending.returnedNote = returnedItems.length ? ("مرتجع جزئي: "+returnedItems.join("، ")) : "بيع كامل بدون مرتجع";
  const effectiveDeliveryPrice = (pending.courierResolution && pending.courierResolution.deliveryPriceFinal!==undefined && pending.courierResolution.deliveryPriceFinal!==null)
    ? pending.courierResolution.deliveryPriceFinal : pending.deliveryPrice;
  const deliveryGoesToAccount = pending.courierType !== "rep" && pending.courierType !== "company"; // owner-delivered or unassigned → credits the shop's delivery account; external rep/company keeps the fee
  if(effectiveDeliveryPrice>0 && !pending.deliveryAccountAssigned && resolveDeliveryAccount && deliveryGoesToAccount){
    state.accounts.delivery.entries.push({date: pending.resolvedDate, amount: effectiveDeliveryPrice, account: resolveDeliveryAccount});
    pending.deliveryAccountAssigned = resolveDeliveryAccount;
    logActivity(`إضافة قيمة توصيل الفاتورة #${pending.number} (${fmtNum(effectiveDeliveryPrice)}) إلى حساب "${ACCOUNT_LABELS[resolveDeliveryAccount]}"`);
  } else if(effectiveDeliveryPrice>0 && !deliveryGoesToAccount){
    logActivity(`قيمة توصيل الفاتورة #${pending.number} (${fmtNum(effectiveDeliveryPrice)}) تبقى لدى ${pending.courierName||"المندوب/الشركة"} ولم تُضف لحساب المتجر`);
  }
  pending.deliveryStage = "pending"; // reset delivery-tracking state now that it's a completed sale
  pending.courierResolution = null;
  logActivity(`تأكيد الفاتورة #${pending.number} بإجمالي مُباع ${fmtNum(soldTotal)}${returnedItems.length?" (بها مرتجع جزئي)":""}`);
  resolvingPendingId = null; resolveDraftItems = []; resolveDraftPayments = []; resolveDeliveryAccount = "cash";
  saveState(); render();
  autoPublishCourierInvoices();
}
function statusTag(status){
  if(status==="pending") return `<span class="tag gold">معلقة</span>`;
  if(status==="shortage") return `<span class="tag" style="background:var(--danger-soft);color:var(--danger);">بها نواقص</span>`;
  if(status==="resolved") return `<span class="tag teal">مؤكدة (بيع)</span>`;
  if(status==="returned") return `<span class="tag" style="background:var(--danger-soft);color:var(--danger);">مرتجعة بالكامل</span>`;
  return "";
}

/* ==================== MONTHLY PROFITS ==================== */
function monthlyProfitsData(){
  const map = {};
  const ensure = (m)=>{ if(!map[m]) map[m] = {sales:0, profit:0, qty:0, byCategory:{}, delivery:0, expenses:0}; return map[m]; };
  const addItem = (dateStr, catId, price, qty)=>{
    const m = (dateStr||"").slice(0,7) || "";
    const cat = state.categories.find(c=>c.id===catId);
    if(!cat) return;
    const t = catTotals(cat);
    const row = ensure(m);
    const catProfit = (price - t.avgP) * qty;
    row.sales += price*qty;
    row.qty += qty;
    row.profit += catProfit;
    if(!row.byCategory[catId]) row.byCategory[catId] = {catName:cat.name, qty:0, sales:0, profit:0};
    row.byCategory[catId].qty += qty;
    row.byCategory[catId].sales += price*qty;
    row.byCategory[catId].profit += catProfit;
  };
  state.salesInvoices.forEach(inv=>{
    inv.items.forEach(it=> addItem(inv.date, it.catId, Number(it.price)||0, Number(it.qty)||0));
  });
  state.pendingInvoices.forEach(inv=>{
    if(inv.status==="pending") return;
    inv.items.forEach(it=>{
      const soldQty = it.soldQty||0;
      if(soldQty>0) addItem(inv.resolvedDate||inv.date, it.catId, Number(it.price)||0, soldQty);
    });
  });
  state.accounts.delivery.entries.forEach(e=>{
    const m = (e.date||"").slice(0,7) || "";
    ensure(m).delivery += Number(e.amount)||0;
  });
  state.accounts.expenses.entries.forEach(e=>{
    const m = (e.date||"").slice(0,7) || "";
    ensure(m).expenses += Number(e.amount)||0;
  });
  return map;
}
function renderMonthlyProfits(){
  const map = monthlyProfitsData();
  const months = Object.keys(map).sort();
  const totalProfit = months.reduce((s,m)=>s+map[m].profit,0);
  const totalSales = months.reduce((s,m)=>s+map[m].sales,0);
  const totalDelivery = months.reduce((s,m)=>s+map[m].delivery,0);
  const totalExpenses = months.reduce((s,m)=>s+map[m].expenses,0);
  const totalNet = totalProfit + totalDelivery - totalExpenses;

  const rows = months.map(m=>{
    const row = map[m];
    const net = row.profit + row.delivery - row.expenses;
    const catList = Object.values(row.byCategory).sort((a,b)=>b.profit-a.profit)
      .map(c=>`<li>${esc(c.catName)}: ${fmtNum(c.qty)} قطعة — مبيعات ${fmtNum(c.sales)} — ربح ${fmtNum(c.profit)}</li>`).join("") || "<li>لا توجد أصناف</li>";
    return `
    <tr>
      <td>${monthLabel(m)}</td><td>${fmtNum(row.qty)}</td><td>${fmt(row.sales)}</td>
      <td class="ledger-flow ${row.profit>=0?'pos':'neg'}">${fmt(row.profit)}</td>
      <td>${fmt(row.delivery)}</td><td>${fmt(row.expenses)}</td>
      <td class="ledger-flow ${net>=0?'pos':'neg'}" style="font-weight:800;">${fmt(net)}</td>
      <td><details><summary>تفاصيل الأصناف (${Object.keys(row.byCategory).length})</summary><ul>${catList}</ul></details></td>
    </tr>`;
  }).join("") || `<tr><td colspan="8" class="empty-row">لا توجد بيانات كافية بعد لعرض تقرير شهري</td></tr>`;

  return `
    <div class="kpi-grid">
      <div class="kpi" style="--accent:var(--gold)"><div class="kpi-label">إجمالي ربح الأصناف</div><div class="kpi-value gold">${fmt(totalProfit)}</div></div>
      <div class="kpi" style="--accent:var(--teal)"><div class="kpi-label">إجمالي التوصيل</div><div class="kpi-value teal">${fmt(totalDelivery)}</div></div>
      <div class="kpi" style="--accent:var(--danger)"><div class="kpi-label">إجمالي مصروفات المشروع</div><div class="kpi-value danger">${fmt(totalExpenses)}</div></div>
      <div class="kpi" style="--accent:var(--gold)"><div class="kpi-label">الصافي الكلي (ربح + توصيل − مصروفات)</div><div class="kpi-value gold">${fmt(totalNet)}</div></div>
    </div>
    <div class="section">
      <div class="section-title">📈 الأرباح الشهرية التفصيلية</div>
      <div class="section-hint">مبني على تاريخ فواتير البيع وعمليات التوصيل والمصروفات المُضافة من هذا التطبيق (البيانات القديمة مدرجة كرصيد افتتاحي غير موزّع على الأشهر). "الصافي" لكل شهر = ربح الأصناف + التوصيل − مصروفات المشروع لنفس الشهر.</div>
      <div class="table-wrap">

function setAccountMainTab(key){ accountMainTab = key; render(); }
async function connectSupabase(){
  const url = document.getElementById("sb_url").value.trim();
  const key = document.getElementById("sb_key").value.trim();
  if(!url || !key){ alert("يرجى إدخال رابط المشروع والمفتاح"); return; }
  saveSupabaseConfig(url, key);
  const ok = initSupabase();
  if(!ok){ alert("تعذّر تهيئة الاتصال. تأكد من صحة الرابط والمفتاح، ومن اتصال الإنترنت."); return; }
  try{
    const { data, error } = await supabaseClient.from("app_state").select("data, updated_at").eq("id", STATE_ROW_ID).maybeSingle();
    if(error) throw error;
    if(data && data.data && Object.keys(data.data).length){
      const useCloud = await showCustomConfirm('توجد بيانات محفوظة مسبقاً في قاعدة البيانات السحابية.\n\nاضغط "تأكيد" لاستخدام بيانات السحابة (سيتم استبدال بيانات هذا الجهاز بها).\nاضغط "إلغاء" لرفع بيانات هذا الجهاز إلى السحابة بدلاً منها.');
      if(useCloud){ state = data.data; lastKnownUpdatedAt = data.updated_at; }
      else { await storageSet(STORAGE_KEY, JSON.stringify(state)); }
    } else {
      await storageSet(STORAGE_KEY, JSON.stringify(state));
    }
    setupRealtimeSync();
    setupOnlineOrdersRealtime();
    autoBackupIfDue();
    saveState();
    render();
    alert("تم الاتصال بقاعدة البيانات السحابية بنجاح ✅");
  }catch(e){
    supabaseClient = null;
    alert("حدث خطأ أثناء الاتصال: " + (e && e.message ? e.message : e) + "\n\nتأكد من إنشاء الجدول والصلاحيات كما في التعليمات.");
    render();
  }
}
async function disconnectSupabase(){
  if(!(await showCustomConfirm("سيتوقف النظام عن المزامنة السحابية ويعمل محلياً على هذا الجهاز فقط. هل تريد المتابعة؟"))) return;
  clearSupabaseConfig();
  render();
}
async function updatePasswords(){
  const adminPw = document.getElementById("admin_pw").value;
  const viewerPw = document.getElementById("viewer_pw").value;
  if(adminPw) state.settings.adminPassword = adminPw;
  if(viewerPw) state.settings.viewerPassword = viewerPw;
  logActivity("تحديث كلمات المرور");
  await saveState();
  render();
  if(lastSaveOk){
    alert("تم الحفظ بنجاح ✅. سيُطلب تسجيل الدخول في المرة القادمة التي يُفتح فيها النظام (أو على أي جهاز آخر متصل بنفس قاعدة البيانات).");
  } else {
    alert("⚠ تعذّر حفظ كلمة المرور. تحقق من اتصال الإنترنت وحاول مرة أخرى قبل إغلاق الصفحة، وإلا فقد لا تُحفظ.");
  }
}
function addInternalTransfer(){
  const fromAccount = document.getElementById("tr_from").value;
  const toAccount = document.getElementById("tr_to").value;
  const amount = parseFloat(document.getElementById("tr_amount").value);
  const date = document.getElementById("tr_date").value || todayStr();
  const notes = document.getElementById("tr_notes").value;
  if(!amount){ alert("يرجى إدخال المبلغ"); return; }
  if(fromAccount===toAccount){ alert("يرجى اختيار حسابين مختلفين"); return; }
  state.internalTransfers.push({id:"trf_"+Date.now()+Math.random().toString(36).slice(2,6), date, fromAccount, toAccount, amount, notes});
  logActivity(`تحويل ${fmtNum(amount)} من "${ACCOUNT_LABELS[fromAccount]}" إلى "${ACCOUNT_LABELS[toAccount]}"`);
  saveState(); render();
}
function deleteInternalTransfer(idx){
  state.internalTransfers.splice(idx,1);
  saveState(); render();
}
function setAccountSubTab(key, sub){ accountSubTab[key] = sub; render(); }
function setOpeningBalance(key){
  const v = parseFloat(document.getElementById("openingBalance_"+key).value);
  state.accounts[key].base.opening = isNaN(v) ? 0 : v;
  logActivity(`تحديث الرصيد الافتتاحي لحساب "${ACCOUNT_LABELS[key]}"`);
  saveState(); render();
}
function addManualEntry(accKey, subKey, fieldIds){
  const acc = state.accounts[accKey];
  const entry = {}; let amount = null;
  fieldIds.forEach(fid=>{
    const el = document.getElementById("mf_"+fid);
    const val = el ? el.value : "";
    entry[fid] = (fid==='amount') ? (parseFloat(val)||0) : val;
    if(fid==='amount') amount = entry[fid];
  });
  if(!amount){ alert("يرجى إدخال القيمة"); return; }
  acc[subKey].push(entry);
  logActivity(`إضافة عملية (${amount}) إلى حساب "${ACCOUNT_LABELS[accKey]}"`);
  saveState(); render();
}
function deleteManualEntry(accKey, subKey, idx){ state.accounts[accKey][subKey].splice(idx,1); saveState(); render(); }

/* ==================== ONLINE STORE (customer-facing storefront) ==================== */
function buildPublicCatalogData(){
  return state.categories.filter(c=>c.onlineEnabled).map(c=>{
    const price = c.onlinePrice!==null && c.onlinePrice!==undefined && c.onlinePrice!=="" ? Number(c.onlinePrice) : Math.round((catTotals(c).avgS||0)*100)/100;
    let colors = null;
    if(c.colors){
      colors = {};
      sortColorsCanonical(Object.keys(c.colors)).forEach(name=>{
        const q = effectiveColorQty(c, name);
        if(q>0) colors[name] = q;
      });
    }
    const stock = catTotals(c).stock;
    let colorImages = null;
    if(colors && c.onlineColorImages){
      colorImages = {};
      Object.keys(colors).forEach(name=>{
        if(c.onlineColorImages[name]) colorImages[name] = c.onlineColorImages[name];
      });
      if(!Object.keys(colorImages).length) colorImages = null;
    }
    return {
      id: c.id, name: c.name, family: catFamilyName(c), sub: catSubName(c),
      price, colors, stock: colors ? null : stock, barcode: c.barcode||"", image: c.onlineImageUrl||"", colorImages
    };
  });
}
async function publishOnlineCatalog(silent){
  if(!supabaseClient){ if(!silent) alert("يجب الاتصال بقاعدة البيانات السحابية أولاً من صفحة الحسابات."); return; }
  const data = buildPublicCatalogData();
  if(!data.length){ if(!silent) alert("لم تُفعّل أي صنف للنشر بعد. فعّل صنفاً واحداً على الأقل من القائمة أدناه."); return; }
  try{
    const nowIso = new Date().toISOString();
    const { error } = await supabaseClient.from("public_catalog").upsert({ id:"main", data, updated_at: nowIso });
    if(error) throw error;
    onlineStoreLastPublished = nowIso;
    if(!silent){ alert(`تم نشر ${data.length} صنف في المتجر الإلكتروني بنجاح ✅`); render(); }
  }catch(e){
    if(!silent) alert("تعذّر النشر: " + (e && e.message ? e.message : e) + "\n\nتأكد من إنشاء جدول public_catalog كما في التعليمات.");
  }
}
async function autoRepublishIfNeeded(catIds){
  if(!supabaseClient) return;
  const affectedIds = Array.isArray(catIds) ? catIds : [catIds];
  const anyPublished = affectedIds.some(id=>{ const c = state.categories.find(x=>x.id===id); return c && c.onlineEnabled; });
  if(anyPublished){ await publishOnlineCatalog(true); }
}

async function syncCourierSettlements(){
  if(!supabaseClient){ alert("يجب الاتصال بقاعدة البيانات السحابية أولاً."); return; }
  try{
    const { data, error } = await supabaseClient.from("courier_settlements").select("*").eq("status","new");
    if(error) throw error;
    let appliedCount = 0;
    for(const row of (data||[])){
      const inv = state.pendingInvoices.find(i=>i.id===row.invoice_id && i.deliveryStage==="in_delivery");
      if(inv){
        const sd = row.settlement_data || {};
        inv.courierResolution = {
          items: (sd.items||[]).map(it=>({catId:it.catId, color:it.color, soldQty:Number(it.soldQty)||0, price:it.price})),
          payments: sd.payments||[],
          deliveryPriceFinal: Number(sd.deliveryPriceFinal)||0,
          settledDate: todayStr()
        };
        inv.deliveryStage = "delivered";
        logActivity(`استلام تسوية أولية من المندوب للفاتورة #${inv.number}`);
        appliedCount++;
      }
      await supabaseClient.from("courier_settlements").update({status:"processed"}).eq("id", row.id);
    }
    if(appliedCount>0){ await saveState(); await autoPublishCourierInvoices(); }
    render();
    alert(appliedCount>0 ? `تم استلام ${appliedCount} تسوية جديدة من المندوبين ✅` : "لا توجد تسويات جديدة من المندوبين حالياً");
  }catch(e){
    alert("تعذّر التحديث من المندوبين: " + (e && e.message ? e.message : e) + "\n\nتأكد من إنشاء جدول courier_settlements كما في التعليمات.");
  }
}

function resizeImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxDim || h > maxDim){
          if(w > h){ h = Math.round(h * maxDim / w); w = maxDim; }
          else { w = Math.round(w * maxDim / h); h = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = ()=> reject(new Error("تعذّر قراءة ملف الصورة"));
      img.src = e.target.result;
    };
    reader.onerror = ()=> reject(new Error("تعذّر قراءة الملف"));
    reader.readAsDataURL(file);
  });
}

async function importCustomerOrder(orderId){
  const order = customerOrdersCache.find(o=>o.id===orderId);
  if(!order) return;
  const od = order.order_data;
  const items = [];
  (od.items||[]).forEach(it=>{
    const cat = state.categories.find(c=>c.id===it.catId);
    if(!cat) return;
    items.push({catId: cat.id, catName: cat.name, color: it.color||"", price: Number(it.price)||0, qty: Number(it.qty)||0, total: Math.round((Number(it.price)||0)*(Number(it.qty)||0)*100)/100});
  });
  if(!items.length){ alert("لا توجد أصناف صالحة في هذا الطلب"); return; }
  const cityGroup = od.cityGroup==="tripoli" || od.cityGroup==="other" ? od.cityGroup : cityGroupOf(od.city||"");
  const otherCityName = cityGroup==="other" ? (od.otherCityName||"") : "";
  const number = cityGroup==="tripoli" ? state.nextPendingInvoiceNoTripoli++ : state.nextPendingInvoiceNoOther++;
  const totalAmount = items.reduce((s,it)=>s+it.total,0);
  const check = checkPendingStockAvailability(items);
  const invoice = {
    id:"pdinv_"+Math.random().toString(36).slice(2), number, cityGroup,
    date: todayStr(), phone1: od.phone1||"", phone2: od.phone2||"", city: od.city||"", otherCityName, notes: "طلب من المتجر الإلكتروني" + (od.notes?" — "+od.notes:""),
    zone: "", deliveryPrice: 0, deliveryAccountAssigned: null,
    courierType: null, courierName: "", deliveryStage: "pending", courierResolution: null,
    items,
    totalAmount: Math.round(totalAmount*100)/100,
    status: check.ok ? "pending" : "shortage", payments: [], cardFeeApplied:false, cardFeeAmount:0, resolvedDate:null, returnedNote:""
  };
  state.pendingInvoices.push(invoice);
  logActivity(`استيراد طلب من المتجر الإلكتروني → فاتورة #${invoice.number} (${cityGroupLabel(cityGroup)})`);
  try{
    if(supabaseClient){
      await supabaseClient.from("customer_orders").update({status:"imported"}).eq("id", orderId);
    }
  }catch(e){ console.error("Failed to mark order imported", e); }
  customerOrdersCache = customerOrdersCache.filter(o=>o.id!==orderId);
  saveState(); render();
  alert(`تم استيراد الطلب كفاتورة ${cityGroupLabel(cityGroup)} #${invoice.number}${check.ok?"":" — ⚠ بها نواقص في المخزون"}`);
}
async function dismissCustomerOrder(orderId){
  if(!(await showCustomConfirm("سيتم تجاهل هذا الطلب دون إنشاء فاتورة. هل أنت متأكد؟"))) return;

}

let backupsCache = [];
async function createBackupSnapshot(manual){
  if(!supabaseClient){
    if(manual) alert("يجب الاتصال بقاعدة البيانات السحابية أولاً من صفحة الحسابات لتفعيل النسخ الاحتياطي.");
    return false;
  }
  try{
    const nowIso = new Date().toISOString();
    const id = "bk_" + Date.now() + Math.random().toString(36).slice(2,6);
    const { error } = await supabaseClient.from("state_backups").insert({ id, data: state, created_at: nowIso });
    if(error) throw error;
    state.settings.lastBackupDate = nowIso;
    if(manual){ await saveState(); alert("تم إنشاء نسخة احتياطية بنجاح ✅"); render(); }
    return true;
  }catch(e){
    if(manual) alert("تعذّر إنشاء النسخة الاحتياطية: " + (e && e.message ? e.message : e) + "\n\nتأكد من إنشاء جدول state_backups كما في التعليمات.");
    return false;
  }
}
async function autoBackupIfDue(){
  if(!supabaseClient) return;
  const last = state.settings.lastBackupDate;
  const dueSince = last ? (Date.now() - new Date(last).getTime()) : Infinity;
  if(dueSince > 24*60*60*1000){ await createBackupSnapshot(false); }
}
async function refreshBackupsList(){
  if(!supabaseClient){ alert("يجب الاتصال بقاعدة البيانات السحابية أولاً."); return; }

  }
}
async function restoreBackup(backupId){

}
