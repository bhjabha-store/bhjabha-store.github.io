function setRepPin(repId, val){
  const rep = state.deliveryReps.find(r=>r.id===repId);
  if(!rep) return;
  const pin = (val||"").trim();
  if(!/^\d{4}$/.test(pin)){ alert("الرقم السري يجب أن يكون 4 أرقام بالضبط"); render(); return; }
  if(state.deliveryReps.some(r=>r.id!==repId && r.pin===pin)){ alert("هذا الرقم مستخدم من مندوب آخر — اختر رقماً مختلفاً"); render(); return; }
  rep.pin = pin;
  logActivity(`تحديث الرقم السري للمندوب "${rep.name}"`);
  saveState(); render();
  autoPublishCourierInvoices();
}
function setRepName(repId, val){
  const rep = state.deliveryReps.find(r=>r.id===repId);
  if(!rep) return;
  const name = (val||"").trim();
  if(!name){ alert("اسم المندوب لا يمكن أن يكون فارغاً"); render(); return; }
  const oldName = rep.name;
  // keep any invoices already assigned to this rep pointing at the new name
  state.pendingInvoices.forEach(inv=>{ if(inv.courierType==="rep" && inv.courierName===oldName) inv.courierName = name; });
  rep.name = name;
  logActivity(`تعديل اسم المندوب من "${oldName}" إلى "${name}"`);
  saveState(); render();
  autoPublishCourierInvoices();
}
async function addNewRep(){
  const nameEl = document.getElementById("newRepName");
  const pinEl = document.getElementById("newRepPin");
  const name = nameEl.value.trim();
  const pin = pinEl.value.trim();
  if(!name){ alert("أدخل اسم المندوب"); return; }
  if(!/^\d{4}$/.test(pin)){ alert("الرقم السري يجب أن يكون 4 أرقام بالضبط"); return; }
  if(state.deliveryReps.some(r=>r.pin===pin)){ alert("هذا الرقم مستخدم من مندوب آخر — اختر رقماً مختلفاً"); return; }
  state.deliveryReps.push({id:"rep_"+Date.now()+Math.random().toString(36).slice(2,6), name, pin});
  logActivity(`إضافة مندوب جديد: ${name}`);
  nameEl.value = ""; pinEl.value = "";
  await saveState(); render();
  await autoPublishCourierInvoices();
}
async function deleteRep(repId){
  const rep = state.deliveryReps.find(r=>r.id===repId);
  if(!rep) return;
  const hasActive = state.pendingInvoices.some(inv=>inv.courierType==="rep" && inv.courierName===rep.name && (inv.deliveryStage==="in_delivery"||inv.deliveryStage==="delivered"));
  if(hasActive){ alert("لا يمكن حذف هذا المندوب لأن لديه طلبيات قيد التوصيل أو مسلَّمة حالياً — أنهِ تسويتها أولاً."); return; }
  if(!(await showCustomConfirm(`حذف المندوب "${rep.name}" نهائياً؟`))) return;
  state.deliveryReps = state.deliveryReps.filter(r=>r.id!==repId);
  logActivity(`حذف المندوب "${rep.name}"`);
  await saveState(); render();
  await autoPublishCourierInvoices();
}
function renderRepsPage(){
  const rows = state.deliveryReps.map(rep=>{
    const activeCount = state.pendingInvoices.filter(inv=>inv.courierType==="rep" && inv.courierName===rep.name && (inv.deliveryStage==="in_delivery"||inv.deliveryStage==="delivered")).length;
    return `<tr>
      <td><input type="text" value="${esc(rep.name)}" style="width:140px;" onchange="setRepName('${rep.id}', this.value)"></td>
      <td><input type="text" value="${esc(rep.pin)}" maxlength="4" inputmode="numeric" style="width:80px;text-align:center;font-family:monospace;" onchange="setRepPin('${rep.id}', this.value)" placeholder="----"></td>
      <td>${fmtNum(activeCount)}</td>
      <td><button class="btn ghost" onclick="deleteRep('${rep.id}')">🗑 حذف</button></td>
    </tr>`;
  }).join("") || `<tr><td colspan="4" class="empty-row">لا يوجد مندوبون مضافون بعد</td></tr>`;

  return `
    <div class="section">
      <div class="section-title">➕ إضافة مندوب جديد</div>
      <div class="form-row">
        <div class="field"><label>الاسم</label><input type="text" id="newRepName" placeholder="اسم المندوب"></div>
        <div class="field"><label>رقم سري (4 أرقام)</label><input type="text" id="newRepPin" maxlength="4" inputmode="numeric" placeholder="مثال: 4821"></div>
      </div>
      <button class="btn gold" onclick="addNewRep()">➕ إضافة</button>
    </div>
    <div class="section">
      <div class="section-title">👥 كل المندوبين</div>
      <div class="section-hint">عدّل الرقم السري أو الاسم مباشرة — يُنشر التحديث تلقائياً لبوابة المندوبين إذا كنت متصلاً بالسحابة</div>
      <div class="table-wrap" style="max-height:480px;">
        <table><thead><tr><th>الاسم</th><th>الرقم السري</th><th>طلبيات نشطة حالياً</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table>
      </div>
    </div>
  `;
}
/* ==================== CUSTOMERS (CRM: search by phone) ==================== */
let customerSearchTerm = "";
function searchCustomers(v){ customerSearchTerm = v; render(); }
function customerOrderHistory(term){
  term = (term||"").trim();
  if(!term) return [];
  const matches = state.pendingInvoices.filter(inv=>
    (inv.phone1 && inv.phone1.includes(term)) || (inv.phone2 && inv.phone2.includes(term))
  );
  return matches.sort((a,b)=>(b.resolvedDate||b.date||"").localeCompare(a.resolvedDate||a.date||""));
}
function renderCustomersPage(){
  const results = customerOrderHistory(customerSearchTerm);
  let summaryHtml = "";
  if(customerSearchTerm && results.length){
    const resolved = results.filter(r=>r.status==="resolved");
    const totalSpent = resolved.reduce((s,r)=>s+(Number(r.totalAmount)||0),0);
    const totalOrders = results.length;
    summaryHtml = `
      <div class="kpi-grid" style="margin-bottom:16px;">
        <div class="kpi" style="--accent:var(--wine)"><div class="kpi-label">عدد الفواتير المرتبطة بهذا الرقم</div><div class="kpi-value">${fmtNum(totalOrders)}</div></div>
        <div class="kpi" style="--accent:var(--teal)"><div class="kpi-label">عدد المبيعات المؤكدة</div><div class="kpi-value teal">${fmtNum(resolved.length)}</div></div>
        <div class="kpi" style="--accent:var(--gold)"><div class="kpi-label">إجمالي ما اشتراه هذا الزبون</div><div class="kpi-value gold">${fmt(totalSpent)}</div></div>
      </div>`;
  }
  const rows = results.map(inv=>{
    const items = inv.items.map(it=>`${esc(it.catName)}${it.color?" ("+esc(it.color)+")":""}: ${fmtNum(it.status==='pending'?it.qty:(it.soldQty||0))}`).join("، ");
    return `<tr><td><span class="invoice-badge">${cityGroupLabel(inv.cityGroup)} #${inv.number}</span></td><td>${fmtDate(inv.resolvedDate||inv.date)}</td>
      <td>${esc(inv.phone1||"-")}${inv.phone2?" / "+esc(inv.phone2):""}</td><td>${esc(inv.city||"-")}</td>
      <td>${statusTag(inv.status)}</td><td>${fmt(inv.totalAmount)}</td>
      <td style="max-width:260px;white-space:normal;">${items}</td></tr>`;
  }).join("") || (customerSearchTerm ? `<tr><td colspan="7" class="empty-row">لا توجد فواتير مرتبطة بهذا الرقم</td></tr>` : `<tr><td colspan="7" class="empty-row">اكتب رقم هاتف الزبون للبحث</td></tr>`);
  return `
    <div class="section">
      <div class="section-title">👥 بحث عن زبون</div>
      <div class="section-hint">اكتب رقم الهاتف (كاملاً أو جزءاً منه) لعرض كل الفواتير المرتبطة به وتاريخ مشترياته</div>
      <input type="text" class="viewer-safe" placeholder="🔎 رقم الهاتف..." value="${esc(customerSearchTerm)}" oninput="searchCustomers(this.value)"
        style="width:100%;max-width:360px;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:13px;background:#FCFAF6;">
      ${summaryHtml}
      <div class="table-wrap" style="margin-top:14px;max-height:500px;">
        <table><thead><tr><th>الفاتورة</th><th>التاريخ</th><th>الهاتف</th><th>العنوان</th><th>الحالة</th><th>الإجمالي</th><th>الأصناف</th></tr></thead>
        <tbody>${rows}</tbody></table>
      </div>
    </div>`;
}
function setInventoryActual(catId, val){
  if(!state.inventoryCheck[catId]) state.inventoryCheck[catId] = {actual:"",notes:""};
  state.inventoryCheck[catId].actual = val==="" ? "" : Number(val);
  saveState(); render();
}
function setInventoryNotes(catId, val){
  if(!state.inventoryCheck[catId]) state.inventoryCheck[catId] = {actual:"",notes:""};
  state.inventoryCheck[catId].notes = val;
  saveState();
}

/* ==================== EXCEL EXPORT ==================== */
function exportToExcel(){
  try{
    const wb = XLSX.utils.book_new();

    const catRows = state.categories.map(c=>{
      const t = catTotals(c);
      return {
        "المنتج الرئيسي": catFamilyName(c), "التصنيف الفرعي": catSubName(c), "الصنف": c.name,
        "عدد قطع المشتريات": Math.round(t.pQty*100)/100, "إجمالي مبلغ المشتريات": Math.round(t.pAmt*100)/100, "متوسط سعر الشراء": Math.round(t.avgP*100)/100,
        "عدد قطع المبيعات": Math.round(t.sQty*100)/100, "إجمالي مبلغ المبيعات": Math.round(t.sAmt*100)/100, "متوسط سعر البيع": Math.round(t.avgS*100)/100,
        "المخزون الحالي": Math.round(t.stock*100)/100, "قيمة المخزون": Math.round(t.stockValue*100)/100, "الأرباح": Math.round(t.profit*100)/100,
      };
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(catRows), "ملخص الأصناف");

    const purRows = [];
    state.purchaseInvoices.forEach(inv=> inv.items.forEach(it=> purRows.push({
      "رقم الفاتورة": inv.number, التاريخ: inv.date, البائع: inv.seller||"", الصنف: it.catName, اللون: it.color||"",
      السعر: it.price, العدد: it.qty, الإجمالي: it.total, "طريقة الدفع": paymentsSummary(inv.payments)
    })));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(purRows.length?purRows:[{ملاحظة:"لا توجد فواتير شراء بعد"}]), "فواتير الشراء");

    const salRows = [];
    allSalesRecordsForDisplay().forEach(inv=> inv.items.forEach(it=> salRows.push({
      "رقم الفاتورة": inv.number, "تصنيف الفاتورة": cityGroupLabel(inv.cityGroup), التاريخ: inv.date, المصدر: inv.source, الحالة: inv.statusLabel||"مكتملة",
      الصنف: it.catName, اللون: it.color||"", السعر: it.price, العدد: it.qty, الإجمالي: it.total, "الهاتف 1": inv.phone1||"", "الهاتف 2": inv.phone2||"", العنوان: inv.city||"",
      "طريقة الدفع": paymentsSummary(inv.payments), "عمولة بطاقة": inv.cardFeeApplied ? inv.cardFeeAmount : 0
    })));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(salRows.length?salRows:[{ملاحظة:"لا توجد فواتير بيع بعد"}]), "فواتير البيع");

    const pendRows = [];
    state.pendingInvoices.forEach(inv=> inv.items.forEach(it=> pendRows.push({
      "رقم الفاتورة": inv.number, "تصنيف الفاتورة": cityGroupLabel(inv.cityGroup), الحالة: inv.status==='pending'?'معلقة':(inv.status==='resolved'?'مؤكدة (بيع)':'مرتجعة بالكامل'),
      التاريخ: inv.date, الصنف: it.catName, اللون: it.color||"", السعر: it.price, "العدد الأصلي": it.qty, "المُباع فعلياً": it.soldQty===null||it.soldQty===undefined?"":it.soldQty,
      "الهاتف 1": inv.phone1||"", "الهاتف 2": inv.phone2||"", العنوان: inv.city||"", المنطقة: inv.zone||"", "سعر التوصيل": inv.deliveryPrice||0, ملاحظة: inv.returnedNote||""
    })));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(pendRows.length?pendRows:[{ملاحظة:"لا توجد فواتير مبدئية بعد"}]), "فواتير مبدئية");

    const colorRows = [];
    state.categories.forEach(c=>{
      if(c.colors){
        sortColorsCanonical(Object.keys(c.colors)).forEach(color=> colorRows.push({الصنف:c.name, "المنتج الرئيسي":catFamilyName(c), "التصنيف الفرعي":catSubName(c), اللون:color, الكمية:c.colors[color]}));
      }
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(colorRows.length?colorRows:[{ملاحظة:"لا توجد بيانات ألوان"}]), "الألوان");

    const finRows = [
      {الحساب:"كاش", البند:"الرصيد الحالي", القيمة: Math.round(accountBalance('cash')*100)/100},
      {الحساب:"بطاقة مصرفية", البند:"الرصيد الحالي", القيمة: Math.round(accountBalance('card')*100)/100},
      {الحساب:"حوالات", البند:"الرصيد الحالي", القيمة: Math.round(accountBalance('transfers')*100)/100},
      {الحساب:"التوصيل", البند:"إجمالي قيم التوصيل", القيمة: Math.round(deliveryTotal()*100)/100},
      {الحساب:"مصروفات المشروع", البند:"الإجمالي", القيمة: Math.round(expensesTotal()*100)/100},
      {الحساب:"المبلغ المسحوب", البند:"إجمالي المسحوب", القيمة: Math.round(cashWithdrawnRemaining().withdrawn*100)/100},
      {الحساب:"المبلغ المسحوب", البند:"إجمالي المسدد", القيمة: Math.round(cashWithdrawnRemaining().repaid*100)/100},
      {الحساب:"المبلغ المسحوب", البند:"المتبقي غير المسدد", القيمة: Math.round(cashWithdrawnRemaining().remaining*100)/100},
    ];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(finRows), "الحسابات المالية");

    const monthMap = monthlyProfitsData();
    const monthRows = Object.keys(monthMap).sort().map(m=>{
      const row = monthMap[m];
      const net = row.profit + row.delivery - row.expenses;
      return {
        الشهر: monthLabel(m), "عدد القطع المباعة": Math.round(row.qty*100)/100,
        "إجمالي المبيعات": Math.round(row.sales*100)/100, "ربح الأصناف": Math.round(row.profit*100)/100,
        التوصيل: Math.round(row.delivery*100)/100, المصروفات: Math.round(row.expenses*100)/100,
        الصافي: Math.round(net*100)/100
      };
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(monthRows.length?monthRows:[{ملاحظة:"لا توجد فواتير بيع بعد"}]), "الأرباح الشهرية");

    const monthCatRows = [];
    Object.keys(monthMap).sort().forEach(m=>{
      Object.values(monthMap[m].byCategory).forEach(c=> monthCatRows.push({
        الشهر: monthLabel(m), الصنف: c.catName, "عدد القطع": Math.round(c.qty*100)/100,
        المبيعات: Math.round(c.sales*100)/100, الربح: Math.round(c.profit*100)/100
      }));
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(monthCatRows.length?monthCatRows:[{ملاحظة:"لا توجد بيانات بعد"}]), "ربح الأصناف الشهري");

    const transferRows = (state.internalTransfers||[]).map(t=>({
      التاريخ: t.date, من: ACCOUNT_LABELS[t.fromAccount], إلى: ACCOUNT_LABELS[t.toAccount], المبلغ: t.amount, ملاحظات: t.notes||""
    }));
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(transferRows.length?transferRows:[{ملاحظة:"لا توجد تحويلات بعد"}]), "تحويلات بين الحسابات");

    const invRows = state.categories.map(c=>{
      const t = catTotals(c); const ic = state.inventoryCheck[c.id] || {};
      const hasActual = ic.actual !== "" && ic.actual !== undefined && ic.actual !== null;
      return { الصنف:c.name, "المنتج الرئيسي":catFamilyName(c), "التصنيف الفرعي":catSubName(c), "مخزون النظام":Math.round(t.stock*100)/100,
        "المخزون الفعلي": hasActual? ic.actual : "", "الفرق": hasActual? Math.round((ic.actual-t.stock)*100)/100 : "", ملاحظات: ic.notes||"" };
    });
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(invRows), "الجرد");

    XLSX.writeFile(wb, "منظومة-بحجابها-" + todayStr() + ".xlsx");
    logActivity("تم تصدير ملف Excel");
    saveState();
  }catch(e){
    console.error(e);
    alert("حدث خطأ أثناء التصدير. تأكد من اتصال الإنترنت (مطلوب لتحميل مكتبة التصدير).");
  }
}

loadState();
</script>
