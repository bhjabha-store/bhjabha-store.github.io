<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>متجر بحجابها</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --wine:#7C2D42; --wine-dark:#5E2233; --gold:#C9A24B; --teal:#3E7C74;
  --ink:#2B2620; --surface:#FBF7EF; --card:#FFFFFF;
  --danger:#B3423F; --danger-soft:#F6E4E2;
  --muted:#8B8378; --border:#E9E1D3; --text:#2B2620;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--surface);color:var(--text);font-family:Tahoma,"Segoe UI","Noto Sans Arabic",Arial,sans-serif;direction:rtl;padding-bottom:90px;}
.topbar{background:linear-gradient(135deg,var(--wine),var(--wine-dark));color:#fff;padding:calc(16px + env(safe-area-inset-top)) 18px 16px;text-align:center;}
.topbar .store-name{font-size:19px;font-weight:800;}
.topbar .store-sub{font-size:12px;opacity:.85;margin-top:2px;}
.container{max-width:640px;margin:0 auto;padding:16px;}
.section{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:16px;}
.section-title{font-size:15px;font-weight:800;margin-bottom:4px;}
.section-hint{font-size:12px;color:var(--muted);margin-bottom:12px;}
.item-card{border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:12px;}
.item-img{width:100%;height:180px;object-fit:cover;border-radius:9px;margin-bottom:10px;background:#f2ede1;}
.item-img-placeholder{width:100%;height:180px;border-radius:9px;margin-bottom:10px;background:#f2ede1;display:flex;align-items:center;justify-content:center;font-size:40px;color:#d8cfbb;}
.item-name{font-size:14.5px;font-weight:700;margin-bottom:2px;}
.item-cat{font-size:11px;color:var(--muted);margin-bottom:8px;}
.item-price{font-size:14px;font-weight:800;color:var(--wine);margin-bottom:8px;}
.item-price .cur{font-size:11px;font-weight:400;color:var(--muted);}
.color-select, .qty-input{width:100%;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:14px;margin-bottom:8px;background:#FCFAF6;}
.out-of-stock{color:var(--danger);font-size:12px;font-weight:700;padding:8px;text-align:center;}
.btn{padding:10px 16px;border:none;border-radius:9px;font-weight:700;cursor:pointer;font-size:13.5px;}
.btn-add{background:var(--teal);color:#fff;width:100%;}
.btn-add:disabled{background:#ccc;cursor:not-allowed;}
.cart-bar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;box-shadow:0 -4px 16px rgba(0,0,0,.08);z-index:500;}
.cart-bar .count{font-size:13px;color:var(--muted);}
.cart-bar .total{font-size:16px;font-weight:800;color:var(--wine);}
.cart-bar button{background:var(--wine);color:#fff;padding:11px 26px;}
.cart-modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9998;align-items:flex-end;justify-content:center;}
.cart-modal-overlay.open{display:flex;}
.cart-modal-box{background:#fff;border-radius:16px 16px 0 0;padding:20px;max-width:640px;width:100%;max-height:88vh;overflow-y:auto;}
.cart-line{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.cart-line button{background:none;border:none;color:var(--danger);font-size:16px;cursor:pointer;}
.field{margin-bottom:10px;}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px;}
.field input, .field textarea{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:14px;background:#FCFAF6;}
.confirm-box{text-align:center;padding:30px 16px;}
.confirm-box .icon{font-size:48px;margin-bottom:10px;}
.tag{display:inline-block;background:var(--danger-soft);color:var(--danger);border-radius:6px;padding:2px 8px;font-size:11px;}
.loading{text-align:center;padding:40px;color:var(--muted);}
</style>
</head>
<body>
<div class="topbar">
  <div class="store-name">🧕 متجر بحجابها</div>
  <div class="store-sub">تصفّح واطلب مباشرة</div>
</div>
<div class="container" id="mainContainer">
  <div class="loading">جاري تحميل المنتجات...</div>
</div>

<div class="cart-bar" id="cartBar" style="display:none;">
  <div><div class="count" id="cartCount">0 قطعة</div><div class="total" id="cartTotal">0</div></div>
  <button onclick="openCartModal()">🛒 عرض السلة والطلب</button>
</div>

<div class="cart-modal-overlay" id="cartModal">
  <div class="cart-modal-box" id="cartModalBox"></div>
</div>

<script>
// ============ SUPABASE CONFIGURATION ============
const SUPABASE_URL = "https://wgodzednsugquxfnhqiw.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Ae_4_ZfZDnwtgGWuJ17B3g_a_CP34UZ";

let supabaseClient = null;
let catalog = [];
let cart = []; // {catId, catName, family, sub, color, price, qty, maxQty}

function esc(s){ return (s||"").toString().replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmt(n){ return Number(n||0).toLocaleString("en-US",{maximumFractionDigits:2}); }

async function init(){
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY){
    document.getElementById("mainContainer").innerHTML = `<div class="section"><div class="section-title">⚠ لم يتم إعداد المتجر بعد</div><div class="section-hint">صاحب المتجر يحتاج لصق رابط ومفتاح قاعدة البيانات في أعلى هذا الملف.</div></div>`;
    return;
  }
  try{
    supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const { data, error } = await supabaseClient.from("public_catalog").select("data").eq("id","main").maybeSingle();
    if(error) throw error;
    catalog = (data && data.data) ? data.data : [];
    renderCatalog();
  }catch(e){
    document.getElementById("mainContainer").innerHTML = `<div class="section"><div class="section-title">⚠ تعذّر تحميل المنتجات</div><div class="section-hint">${esc(e && e.message ? e.message : String(e))}</div></div>`;
  }
}

function renderCatalog(){
  const el = document.getElementById("mainContainer");
  if(!catalog.length){
    el.innerHTML = `<div class="section"><div class="section-title">لا توجد منتجات معروضة حالياً</div><div class="section-hint">تفقّد المتجر لاحقاً</div></div>`;
    return;
  }
  const groups = {};
  catalog.forEach(item=>{
    const key = item.family + " ↳ " + item.sub;
    if(!groups[key]) groups[key] = [];
    groups[key].push(item);
  });
  let html = "";
  Object.keys(groups).forEach(groupName=>{
    html += `<div class="section-title" style="margin:14px 4px 8px;">${esc(groupName)}</div>`;
    groups[groupName].forEach(item=>{
      html += renderItemCard(item);
    });
  });
  el.innerHTML = html;
}

function renderItemCard(item){
  const hasColors = item.colors && Object.keys(item.colors).length;
  const outOfStock = hasColors ? Object.keys(item.colors).length===0 : (item.stock<=0);
  let body = "";
  if(outOfStock){
    body = `<div class="out-of-stock">نفدت الكمية حالياً</div>`;
  } else if(hasColors){
    const colorOpts = Object.keys(item.colors).map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("");
    body = `
      <select class="color-select" id="color_${item.id}">${colorOpts}</select>
      <input type="number" class="qty-input" id="qty_${item.id}" value="1" min="1" placeholder="الكمية">
      <button class="btn btn-add" onclick="addToCart('${item.id}')">➕ أضف للسلة</button>`;
  } else {
    body = `
      <input type="number" class="qty-input" id="qty_${item.id}" value="1" min="1" placeholder="الكمية">
      <button class="btn btn-add" onclick="addToCart('${item.id}')">➕ أضف للسلة</button>`;
  }
  const imgHtml = item.image
    ? `<img src="${esc(item.image)}" alt="${esc(item.name)}" class="item-img" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"><div class="item-img-placeholder" style="display:none;">🧕</div>`
    : `<div class="item-img-placeholder">🧕</div>`;
  return `
    <div class="item-card">
      ${imgHtml}
      <div class="item-name">${esc(item.name)}</div>
      <div class="item-cat">${esc(item.family)} ↳ ${esc(item.sub)}</div>
      <div class="item-price">${fmt(item.price)} <span class="cur">د.ل</span></div>
      ${body}
    </div>`;
}

function addToCart(catId){
  const item = catalog.find(i=>i.id===catId);
  if(!item) return;
  const hasColors = item.colors && Object.keys(item.colors).length;
  let color = "", maxQty = item.stock||0;
  if(hasColors){
    const colorSel = document.getElementById("color_"+catId);
    color = colorSel.value;
    maxQty = item.colors[color]||0;
  }
  const qtyEl = document.getElementById("qty_"+catId);
  let qty = parseInt(qtyEl.value)||0;
  if(qty<1){ alert("أدخل كمية صحيحة"); return; }
  if(qty>maxQty){ alert("الكمية المطلوبة غير متوفرة"); return; }

  const existing = cart.find(c=>c.catId===catId && c.color===color);
  if(existing){
    if(existing.qty+qty>maxQty){ alert("الكمية المطلوبة غير متوفرة"); return; }
    existing.qty += qty;
  } else {
    cart.push({catId, catName:item.name, color, price:item.price, qty, maxQty});
  }
  updateCartBar();
  qtyEl.value = 1;
  const bar = document.getElementById("cartBar");
  bar.style.background = "#eef7f0";
  setTimeout(()=>{ bar.style.background = ""; }, 300);
}

function updateCartBar(){
  const totalQty = cart.reduce((s,c)=>s+c.qty,0);
  const totalPrice = cart.reduce((s,c)=>s+c.qty*c.price,0);
  const bar = document.getElementById("cartBar");
  if(totalQty>0){
    bar.style.display = "flex";
    document.getElementById("cartCount").textContent = totalQty + " قطعة";
    document.getElementById("cartTotal").textContent = fmt(totalPrice) + " د.ل";
  } else {
    bar.style.display = "none";
  }
}

function openCartModal(){
  const box = document.getElementById("cartModalBox");
  const totalPrice = cart.reduce((s,c)=>s+c.qty*c.price,0);
  const linesHtml = cart.map((c,i)=>`
    <div class="cart-line">
      <span>${esc(c.catName)}${c.color?" — "+esc(c.color):""}: ${c.qty} × ${fmt(c.price)}</span>
      <span>${fmt(c.qty*c.price)} <button onclick="removeCartLine(${i})">✖</button></span>
    </div>`).join("") || `<div class="section-hint">السلة فارغة</div>`;

  box.innerHTML = `
    <div class="section-title">🛒 سلة الطلب</div>
    <div style="margin:10px 0;">${linesHtml}</div>
    <div style="font-weight:800;font-size:15px;margin:12px 0;text-align:left;">الإجمالي: ${fmt(totalPrice)} د.ل</div>
    <div class="field"><label>الاسم</label><input type="text" id="ck_name" placeholder="اسمك"></div>
    <div class="field"><label>رقم الهاتف 1</label><input type="text" id="ck_phone1" placeholder="رقم للتواصل"></div>
    <div class="field"><label>رقم الهاتف 2 (اختياري)</label><input type="text" id="ck_phone2"></div>
    <div class="field"><label>العنوان / المدينة</label><input type="text" id="ck_city" placeholder="عنوانك بالتفصيل"></div>
    <div class="field"><label>ملاحظات (اختياري)</label><textarea id="ck_notes" rows="2"></textarea></div>
    <button class="btn" style="background:var(--wine);color:#fff;width:100%;font-size:14px;padding:12px;" onclick="submitOrder()">✅ تأكيد الطلب</button>
    <button class="btn" style="background:transparent;color:var(--muted);width:100%;margin-top:6px;" onclick="closeCartModal()">إغلاق</button>
  `;
  document.getElementById("cartModal").classList.add("open");
}
function closeCartModal(){
  document.getElementById("cartModal").classList.remove("open");
}
function removeCartLine(idx){
  cart.splice(idx,1);
  updateCartBar();
  openCartModal();
}
async function submitOrder(){
  if(!cart.length){ alert("السلة فارغة"); return; }
  const name = document.getElementById("ck_name").value.trim();
  const phone1 = document.getElementById("ck_phone1").value.trim();
  const city = document.getElementById("ck_city").value.trim();
  const phone2 = document.getElementById("ck_phone2").value.trim();
  const notes = document.getElementById("ck_notes").value.trim();
  if(!name || !phone1 || !city){ alert("يرجى تعبئة الاسم ورقم الهاتف والعنوان على الأقل"); return; }

  const orderData = {
    name, phone1, phone2, city, notes,
    items: cart.map(c=>({catId:c.catId, color:c.color, price:c.price, qty:c.qty}))
  };
  try{
    const id = "ord_" + Date.now() + Math.random().toString(36).slice(2,8);
    const { error } = await supabaseClient.from("customer_orders").insert({ id, order_data: orderData, status: "new" });
    if(error) throw error;
    cart = [];
    updateCartBar();
    closeCartModal();
    document.getElementById("mainContainer").innerHTML = `
      <div class="section confirm-box">
        <div class="icon">✅</div>
        <div class="section-title">تم إرسال طلبك بنجاح</div>
        <div class="section-hint">سيتواصل معك المتجر قريباً لتأكيد الطلب والتوصيل</div>
      </div>`;
  }catch(e){
    alert("تعذّر إرسال الطلب: " + (e && e.message ? e.message : e));
  }
}

document.getElementById("cartModal").addEventListener("click", (e)=>{
  if(e.target.id==="cartModal") closeCartModal();
});

init();
</script>
</body>
</html>
